const pointerIds = new Set();

function toLocal(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  Sfx.init();
  const p = toLocal(e);
  state.pointer.x = p.x; state.pointer.y = p.y; state.pointer.down = true;
  pointerIds.add(e.pointerId);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  attack(p.x, p.y);
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  if (!pointerIds.has(e.pointerId)) return;
  const p = toLocal(e);
  state.pointer.x = p.x; state.pointer.y = p.y;
}, { passive: true });

function releasePointer(e) {
  pointerIds.delete(e.pointerId);
  if (pointerIds.size === 0) state.pointer.down = false;
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('lostpointercapture', releasePointer);
document.getElementById('muteBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  Sfx.init();
  Sfx.toggleMute();
});
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { state.pointer.down = false; GP.pause('visibility'); }
  else GP.resume('visibility');
});

/* ==================================================================== *
 * 13. 繪製
 * ==================================================================== */
function render() {
  ctx.save();
  if (state.shake > 0.2) ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
  drawBackground();

  // 黏蠅紙
  for (const t of state.traps) {
    const k = clamp(1 - t.t / t.ttl, 0, 1);
    ctx.globalAlpha = 0.55 * k + 0.15;
    ctx.fillStyle = '#e8d98a';
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.8 * k;
    ctx.strokeStyle = '#b8a35a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 0.96, 0, TAU); ctx.stroke();
    for (let i = 0; i < 10; i++) {
      const a = i * 0.9 + t.t;
      ctx.beginPath();
      ctx.moveTo(t.x + Math.cos(a) * t.r * 0.25, t.y + Math.sin(a) * t.r * 0.25);
      ctx.lineTo(t.x + Math.cos(a) * t.r * 0.8, t.y + Math.sin(a) * t.r * 0.8);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // 毒霧
  for (const c of state.clouds) {
    const k = clamp(1 - c.t / c.ttl, 0, 1);
    const g = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, c.r);
    g.addColorStop(0, `rgba(180, 230, 150, ${0.34 * k})`);
    g.addColorStop(0.7, `rgba(140, 200, 120, ${0.18 * k})`);
    g.addColorStop(1, 'rgba(120, 180, 100, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
  }

  // 誘餌
  for (const d of state.decoys) {
    const k = clamp(1 - d.t / d.ttl, 0, 1);
    ctx.globalAlpha = 0.5 * k + 0.12;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(d.x, d.y, 14, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * (0.55 + 0.45 * k), 0, TAU); ctx.stroke();
  }
  // 音波
  for (const wv of state.waves) {
    const k = 1 - wv.t / wv.ttl;
    ctx.globalAlpha = 0.6 * k;
    ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r, 0, TAU); ctx.stroke();
    ctx.lineWidth = 1;
  }
  // 火箭
  for (const r of state.rockets) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffe0a0';
    ctx.beginPath(); ctx.arc(r.x, r.y, 6, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,140,60,.75)';
    ctx.beginPath(); ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x + (r.x - r.tx) * 0.06, r.y + (r.y - r.ty) * 0.06); ctx.stroke();
  }
  // 無人機
  for (const dr of state.drones) {
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(dr.x, dr.y, 10 + Math.sin(timeAlive * 6) * 2, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#7fd4ff';
    ctx.beginPath(); ctx.arc(dr.x, dr.y, 4, 0, TAU); ctx.fill();
    ctx.lineWidth = 1;
  }
  ctx.globalAlpha = 1;

  for (const f of state.flies) drawFly(f);

  if (state.phase === 'playing' && state.pointer.x >= 0) {
    const w = currentWeapon();
    if (w.mode !== 'laser' && state.pointer.down) {
      ctx.globalAlpha = 0.28;
      ctx.strokeStyle = (w.id === 'electric' || w.id === 'twin') ? '#7fd4ff' : '#ffe6b8';
      ctx.lineWidth = 1.5;
      const centers = w.twin ? [state.pointer.x - 55, state.pointer.x + 55] : [state.pointer.x];
      for (const cx of centers) {
        ctx.beginPath(); ctx.arc(cx, state.pointer.y, w.radius, 0, TAU); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  if (state.laser) {
    const k = 1 - state.laser.t / state.laser.ttl;
    const y = state.laser.y, band = state.laser.band;
    const g = ctx.createLinearGradient(0, y - band, 0, y + band);
    g.addColorStop(0, 'rgba(150, 230, 255, 0)');
    g.addColorStop(0.45, `rgba(190, 245, 255, ${0.55 * k})`);
    g.addColorStop(0.5, `rgba(255,255,255,${0.95 * k})`);
    g.addColorStop(0.55, `rgba(190, 245, 255, ${0.55 * k})`);
    g.addColorStop(1, 'rgba(150, 230, 255, 0)');
    ctx.fillStyle = g; ctx.fillRect(0, y - band, W, band * 2);
  }

  drawEffects();

  if (state.weaponLockT > 0) {
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

let lastT = performance.now();
let frameCount = 0;
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  update(dt);
  render();
  frameCount++;
  requestAnimationFrame(loop);
}

/* ==================================================================== *
 * 14. 啟動 + 測試鉤子
 * ==================================================================== */
resize();
Sfx.loadPref();
document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : 'en';
document.title = LANG === 'zh' ? '打擊蒼蠅大作戰 V5 · Fly Swat Rampage' : 'Fly Swat Rampage V5';
const loadingSub = document.getElementById('loadingSub');
if (loadingSub) loadingSub.textContent = LANG === 'zh' ? '打擊蒼蠅大作戰' : 'SWAT OR BE SWARMED';
dom.levelName.textContent = t('levelN', { n: 1, name: lvName(1) });
dom.score.innerHTML = `0<small>${t('scoreUnit')}</small>`;
// 還原累積分數 → 依門檻回推已解鎖武器（不觸發升級 toast）
state.score = loadScore();
state.unlocked = unlockedFromScore(state.score);
state.weaponIndex = state.unlocked - 1;
renderWeaponBar();
updateWeaponChip();
showStart();
GP.init();
GP.loading(60);
requestAnimationFrame(loop);
// 首兩帧畫完才算「可顯示」，再通知 GamePix Player 收 loading bar
requestAnimationFrame(() => requestAnimationFrame(() => {
  GP.loading(100);
  GP.loaded().then(() => GP.hideLoading());
}));

window.__game = {
  get ready() { return true; },
  state, LEVELS, WEAPONS, FLY_TYPES,
  get flies() { return state.flies; },
  get boss() { return state.boss; },
  get clouds() { return state.clouds; },
  get traps() { return state.traps; },
  get defend() { return state.defend; },
  get effects() { return state.effects; },
  get waves() { return state.waves; },
  get decoys() { return state.decoys; },
  get rockets() { return state.rockets; },
  get drones() { return state.drones; },
  get frame() { return frameCount; },
  get weapon() { return currentWeapon().id; },
  get unlocked() { return state.unlocked; },
  get progress() { return loadProgress(); },
  get board() { return loadBoard(); },
  get profile() { return PROFILE; },
  get bests() { return loadBests(); },
  startLevel,
  startEndless,
  showStart,
  showBoard,
  showBoardLevel,
  showGlobalBoard,
  showGlobalLevel,
  renderRename,
  sceneSpec,
  sceneFor,
  sceneHash,
  drawStaticScene,
  lb: LB,
  lbConfig: LB_CONFIG,
  addScore,
  spawnFly: (x, y, type) => {
    const f = new Fly(type || 'house', { x, y });
    if (state.levelConfig && state.levelConfig.defend && !f.friendly) {
      const t = defendTarget();
      f.targetPos = { x: t.x, y: t.y, r: t.r };
    }
    return pushFly(f);
  },
  spawnBee,
  forceSummon: () => state.flies.find((f) => f.isBoss)?.castSummon(),
  forceDive: () => state.flies.find((f) => f.isBoss && !f.isMiniBoss)?.startDive(),
  forceExhaust: (t = 2) => { const b = state.flies.find((f) => f.isBoss); if (b) b.exhaustT = t; },
  forceGust: () => { state.wind = { dir: 1, t: 1.3, strength: 260 }; state.gustT = state.levelConfig.gustEvery || 15; },
  forcePhase2: () => { const b = state.flies.find((f) => f.isBoss && !f.isMiniBoss); if (b) b.hp = Math.floor(b.maxHp * 0.4); },
  setTimeLeft: (v) => { state.timeLeft = v; },
  loseLevel,
  attack,
  viewport: () => ({ w: W, h: H, dpr: DPR }),
  currentWeapon,
  audio: Sfx,
  voice: Voice,
  gp: GP,
  lang: LANG,
  reviveRun,
  saveProgress,
  clearEndlessBoard: () => { try { localStorage.removeItem(BOARD_KEY); } catch (e) { /* ignore */ } },
  clearScore: () => {
    try { localStorage.removeItem(SCORE_KEY); } catch (e) { /* ignore */ }
    state.score = 0; state.unlocked = 1; state.weaponIndex = 0;
    renderWeaponBar(); updateWeaponChip();
  },
};

</script>
</body>

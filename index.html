function baseCamp(g, spec, w, h) {
  const p = spec.pal;
  const sky = g.createLinearGradient(0, 0, 0, h * .62);
  sky.addColorStop(0, p.sky1); sky.addColorStop(0.65, p.sky2); sky.addColorStop(1, p.sky1);
  g.fillStyle = sky; g.fillRect(0, 0, w, h * .62);
  if (spec.time.id === 'night' || spec.time.id === 'neon') {
    for (let i = 0; i < 42; i++) {
      const sx = (i * 79 + spec.n * 17) % w;
      const sy = ((i * 53 + spec.n * 13) % Math.floor(h * .52));
      g.fillStyle = `rgba(255,255,235,${.35 + (i % 4) * .15})`;
      g.beginPath(); g.arc(sx, sy, i % 7 === 0 ? 1.7 : 1, 0, TAU); g.fill();
    }
    sell(g, w * .78, h * .16, w * .055, h * .055, 0, '#f3f0d8');
  } else {
    sell(g, w * .78, h * .16, w * .06, h * .06, 0, 'rgba(255,240,180,.9)');
    sglow(g, w * .78, h * .16, w * .4, 'rgba(255,240,170,.3)');
  }
  g.fillStyle = p.night ? '#1d2a2a' : '#5f7f72';
  g.beginPath();
  g.moveTo(0, h * .52);
  for (let i = 0; i <= 8; i++) g.lineTo((i / 8) * w, h * (.46 + Math.sin(i * 1.7 + spec.n) * .035));
  g.lineTo(w, h * .62); g.lineTo(0, h * .62); g.closePath(); g.fill();
  g.fillStyle = p.night ? '#16231b' : '#3e6b3a';
  for (let i = 0; i < 9; i++) {
    const tx = (i / 8) * w;
    const th = h * (.08 + (i % 3) * .02);
    g.beginPath(); g.arc(tx, h * .55 - th, th * .7, 0, TAU); g.fill();
  }
  const ground = g.createLinearGradient(0, h * .58, 0, h);
  ground.addColorStop(0, p.floor); ground.addColorStop(1, p.wall2);
  g.fillStyle = ground; g.fillRect(0, h * .58, w, h * .42);
  for (let i = 0; i < 80; i++) {
    const gx = (i * 83) % w, gy = h * .59 + ((i * 47) % Math.floor(h * .4));
    sline(g, gx, gy, gx + 2.5, gy - Math.max(3, h * .008), 'rgba(20,55,25,.28)', 1.2);
  }
  if (spec.time.id === 'night') {
    for (let i = 0; i < 14; i++) {
      const fx = (i * 73 + timeAlive * 8) % w;
      const fy = h * (.4 + ((i * 37) % 35) / 100);
      const a = .25 + .25 * Math.sin(timeAlive * 2 + i);
      g.fillStyle = `rgba(255,240,130,${a})`;
      g.beginPath(); g.arc(fx, fy, 1.8, 0, TAU); g.fill();
    }
  }
}

function drawBrickLines(g, x, y, w, h, step, color, offset) {
  g.strokeStyle = color;
  g.lineWidth = 1;
  let row = 0;
  for (let yy = y; yy < y + h; yy += step) {
    g.beginPath(); g.moveTo(x, yy); g.lineTo(x + w, yy); g.stroke();
    const shift = (row % 2 ? step * 0.9 : 0) + (offset || 0);
    for (let xx = x - shift; xx < x + w; xx += step * 1.8) {
      g.beginPath(); g.moveTo(xx, yy); g.lineTo(xx, Math.min(y + h, yy + step)); g.stroke();
    }
    row++;
  }
}

function baseAlley(g, spec, w, h) {
  const p = spec.pal;
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, p.wall2); bg.addColorStop(0.55, p.wall); bg.addColorStop(1, '#07090a');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);

  // 窄天空
  const sky = g.createLinearGradient(0, 0, 0, h * .2);
  sky.addColorStop(0, p.sky1); sky.addColorStop(1, p.sky2);
  g.fillStyle = sky; g.fillRect(w * .2, 0, w * .6, h * .17);

  // 後牆
  const bw = w * .58, bx = (w - bw) / 2, by = h * .12;
  g.fillStyle = p.wall; g.fillRect(bx, by, bw, h * .52);
  g.save(); g.beginPath(); g.rect(bx, by, bw, h * .52); g.clip();
  drawBrickLines(g, bx, by, bw, h * .52, Math.max(14, h * .026), 'rgba(0,0,0,.22)', 5);
  g.restore();
  // 後門與暖光
  const doorW = bw * .3, doorH = h * .24, doorX = w / 2 - doorW / 2, doorY = h * .4;
  g.fillStyle = '#1a1410'; g.fillRect(doorX, doorY, doorW, doorH);
  g.fillStyle = 'rgba(255,180,90,.12)'; g.fillRect(doorX + 3, doorY + 3, doorW - 6, doorH - 6);
  sglow(g, w / 2, doorY + doorH * .45, bw * .32, 'rgba(255,170,80,.10)');

  // 兩側牆（透視）
  const left = new Path2D();
  left.moveTo(0, 0); left.lineTo(w * .2, 0); left.lineTo(w * .14, h * .62); left.lineTo(0, h); left.closePath();
  const right = new Path2D();
  right.moveTo(w, 0); right.lineTo(w * .8, 0); right.lineTo(w * .86, h * .62); right.lineTo(w, h); right.closePath();
  for (const [path, side] of [[left, -1], [right, 1]]) {
    g.save(); g.clip(path);
    g.fillStyle = p.night ? '#0b0d0f' : '#111518';
    g.fill(path, 'evenodd');
    g.clip(path);
    // 磚紋
    drawBrickLines(g, 0, 0, w, h * .62, Math.max(12, h * .023), 'rgba(255,255,255,.055)', 0);
    // 牆面燈光
    g.fillStyle = 'rgba(255,190,110,.05)';
    g.fillRect(side < 0 ? 0 : w * .78, h * .1, w * .26, h * .3);
    g.restore();
  }

  // 地面
  const floor = g.createLinearGradient(0, h * .62, 0, h);
  floor.addColorStop(0, '#181c1f'); floor.addColorStop(1, '#07090a');
  g.fillStyle = floor; g.fillRect(0, h * .62, w, h * .38);
  g.strokeStyle = 'rgba(255,255,255,.045)'; g.lineWidth = 1;
  for (let i = 0; i <= 8; i++) sline(g, w * .5, h * .62, (i / 8) * w, h, 'rgba(255,255,255,.04)', 1);
  for (let y = h * .64; y < h; y += Math.max(14, h * .026)) {
    sline(g, 0, y, w, y, 'rgba(255,255,255,.028)', 1);
  }

  // 水管與側牆細節
  g.strokeStyle = 'rgba(120,140,150,.45)'; g.lineWidth = Math.max(3, w * .012);
  g.beginPath(); g.moveTo(w * .06, 0); g.lineTo(w * .06, h * .34);
  g.quadraticCurveTo(w * .06, h * .4, w * .13, h * .4); g.lineTo(w * .18, h * .4); g.stroke();
  g.beginPath(); g.moveTo(w * .94, 0); g.lineTo(w * .94, h * .3);
  g.quadraticCurveTo(w * .94, h * .36, w * .87, h * .36); g.stroke();
  g.strokeStyle = 'rgba(90,105,115,.35)'; g.lineWidth = Math.max(2, w * .007);
  g.beginPath(); g.moveTo(w * .1, h * .08); g.lineTo(w * .1, h * .56); g.stroke();
  g.beginPath(); g.moveTo(w * .9, h * .16); g.lineTo(w * .9, h * .58); g.stroke();

  // 側面小霓虹
  g.save();
  g.translate(w * .07, h * .26);
  g.rotate(-Math.PI / 2);
  g.font = `700 ${Math.round(w * .035)}px system-ui, sans-serif`;
  g.textAlign = 'center'; g.shadowColor = p.accent; g.shadowBlur = 14;
  g.fillStyle = p.accent; g.fillText('BAR', 0, 0);
  g.restore();
  sglow(g, w * .07, h * .26, w * .16, 'rgba(255,80,160,.10)');

  // 積水與反光
  for (let i = 0; i < 3; i++) {
    const px = w * (.26 + i * .22), py = h * (.74 + (i % 2) * .07);
    sell(g, px, py, w * (.1 + i * .015), h * .022, 0, 'rgba(120,180,210,.16)');
    sell(g, px, py - 1, w * (.06 + i * .01), h * .009, 0, 'rgba(220,245,255,.12)');
  }
  // 底部霧
  const fog = g.createLinearGradient(0, h * .6, 0, h);
  fog.addColorStop(0, 'rgba(80,100,110,0)');
  fog.addColorStop(1, 'rgba(80,100,110,.10)');
  g.fillStyle = fog; g.fillRect(0, h * .6, w, h * .4);
}

/* ---------- 道具 ---------- */
function drawWatermelonAt(g, x, y, r, p) {
  g.save(); g.translate(x, y);
  sell(g, 0, r * .26, r * 1.35, r * .62, 0, '#efe7dc');
  sell(g, 0, r * .2, r * 1.28, r * .56, 0, '#f0f0ea');
  g.save();
  g.beginPath(); g.arc(0, 0, r, Math.PI, TAU); g.closePath(); g.clip();
  g.fillStyle = '#2f7d3a'; g.fillRect(-r, -r, r * 2, r);
  g.fillStyle = '#c8e6a0'; g.beginPath(); g.arc(0, 0, r * .93, Math.PI, TAU); g.fill();
  g.fillStyle = '#e8353f'; g.beginPath(); g.arc(0, 0, r * .85, Math.PI, TAU); g.fill();
  g.restore();
  g.fillStyle = '#3a1a1a';
  for (let i = 0; i < 9; i++) {
    const a = Math.PI + .25 + (i / 8) * (Math.PI - .5);
    const rr = r * (.35 + (i % 3) * .09);
    g.beginPath(); g.ellipse(Math.cos(a) * rr, Math.sin(a) * rr, 2.4, 3.6, a, 0, TAU); g.fill();
  }
  g.restore();
}

function drawCakeAt(g, u, p, type) {
  const kind = type || 'cake';
  sell(g, 0, u * .02, u * .36, u * .08, 0, 'rgba(0,0,0,.2)');
  if (kind === 'donut' || kind === 'tart' || kind === 'pie' || kind === 'macaron') {
    sell(g, 0, u * .13, u * .4, u * .04, 0, '#d8c7b2');
    if (kind === 'macaron') {
      for (let i = 0; i < 5; i++) sell(g, (i - 2) * u * .14, -u * .02 - (i % 2) * u * .08, u * .09, u * .05, 0, i % 2 ? '#f4a7bb' : '#b7e0c0');
    } else if (kind === 'pie') {
      sell(g, 0, u * .06, u * .28, u * .09, 0, '#c98d52');
      sell(g, 0, u * .02, u * .24, u * .07, 0, '#e0b06a');
      for (let i = 0; i < 3; i++) sline(g, -u * .2, u * .02 + i * u * .04, u * .2, u * .02 + i * u * .04, '#a9703d', 2);
    } else if (kind === 'donut') {
      for (let i = 0; i < 3; i++) {
        const dx = (i - 1) * u * .18;
        sell(g, dx, -u * .02, u * .1, u * .1, 0, '#d79a58');
        sell(g, dx, -u * .03, u * .085, u * .085, 0, '#f0b8c8');
        sell(g, dx, -u * .03, u * .035, u * .035, 0, '#6b4a30');
      }
    } else {
      sell(g, 0, u * .04, u * .24, u * .08, 0, '#e6bf7f');
      sell(g, 0, u * .02, u * .2, u * .06, 0, '#f6d89a');
    }
    return;
  }
  if (kind === 'weddingCake') {
    srr(g, -u * .18, -u * .42, u * .36, u * .42, 8, '#f8f0e2');
    srr(g, -u * .24, -u * .18, u * .48, u * .18, 6, '#fff7ea');
    for (let i = 0; i < 3; i++) srr(g, -u * .2 + i * u * .14, -u * .54 + i * u * .06, u * .12, u * .12, 3, '#f4a7bb');
    g.fillStyle = '#d63b4a'; g.beginPath(); g.arc(0, -u * .58, u * .03, 0, TAU); g.fill();
    return;
  }
  srr(g, -u * .27, -u * .18, u * .54, u * .2, 6, kind === 'cake' ? '#f2d9c0' : '#f8e6c8');
  srr(g, -u * .24, -u * .3, u * .48, u * .14, 5, '#f7e3cc');
  g.fillStyle = '#e8353f';
  for (let i = 0; i < 5; i++) {
    g.beginPath(); g.arc(-u * .16 + i * u * .08, -u * .34, u * .025, 0, TAU); g.fill();
  }
  g.fillStyle = '#fff6ea';
  for (let i = 0; i < 3; i++) srr(g, -u * .12 + i * u * .12, -u * .42, u * .02, u * .1, 1, '#fff6ea');
}

function drawStall(g, u, type, p, v) {
  const kind = type || 'fruit';
  const stage = v || 1;
  const tilt = ((stage % 3) - 1) * 0.015;
  const label = {
    fruit: 'FRUIT', fish: 'FISH', meat: 'MEAT', veg: 'VEG', noodles: 'NOODLE',
    flowers: 'FLOWERS', eggs: 'EGGS', spice: 'SPICE', tea: 'TEA', bread: 'BREAD',
    clothes: 'CLOTHES', toys: 'TOYS', umbrella: 'UMBRELLA',
  }[kind] || 'MARKET';
  g.save();
  g.rotate(tilt);
  // 攤位影子
  g.fillStyle = 'rgba(0,0,0,.28)';
  g.beginPath(); g.ellipse(0, u * .03, u * .48, u * .07, 0, 0, TAU); g.fill();
  // 遮陽棚（條紋數量依關卡）
  const stripes = 5 + (stage % 3);
  for (let i = 0; i < stripes; i++) {
    g.fillStyle = i % 2 ? p.accent : '#f0e3cc';
    const x0 = -u * .46 + i * (u * .92 / stripes);
    const x1 = -u * .46 + (i + 1) * (u * .92 / stripes);
    g.beginPath();
    g.moveTo(x0, -u * .55); g.lineTo(x1, -u * .55);
    g.lineTo(x1 + u * .025, -u * .33); g.lineTo(x0 + u * .025, -u * .33);
    g.closePath(); g.fill();
  }
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(-u * .46, -u * .34, u * .92, u * .025);
  // 招牌
  srr(g, -u * .2, -u * .48, u * .4, u * .11, 3, '#f4e8d0');
  g.fillStyle = '#5a3d28'; g.font = `800 ${Math.round(u * (label.length > 6 ? .042 : .058))}px system-ui, sans-serif`;
  g.textAlign = 'center'; g.fillText(label, 0, -u * .395);
  // 吊燈
  sline(g, -u * .22, -u * .33, -u * .22, -u * .25, '#4a3a2a', 2);
  sglow(g, -u * .22, -u * .23, u * .16, 'rgba(255,220,150,.28)');
  g.fillStyle = '#ffe7a6'; g.beginPath(); g.arc(-u * .22, -u * .23, u * .018, 0, TAU); g.fill();
  // 櫃台
  srr(g, -u * .44, -u * .27, u * .88, u * .09, 2, '#5a3d28');
  srr(g, -u * .42, -u * .18, u * .84, u * .22, 3, '#3f2a1c');
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(-u * .42, -u * .17, u * .84, u * .025);
  for (let i = 0; i < 4; i++) sline(g, -u * .38 + i * u * .22, -u * .02, -u * .38 + i * u * .22, u * .03, 'rgba(0,0,0,.18)', 1);
  // 類型道具
  const items = {
    fruit: ['#e85d4a', '#f2a33c', '#8fc24a', '#b06ad9'], fish: ['#a8c4cc', '#d8e4e6', '#7d9aa4'],
    meat: ['#b84b45', '#d97b6f', '#8c3838'], veg: ['#4f8f3d', '#7fb84a', '#d9b44a'],
    noodles: ['#f0d59a', '#c98d52', '#8fc24a'], flowers: ['#f28ab0', '#f2d35c', '#b78cf2'],
    eggs: ['#f7e3c0', '#e8c89a', '#c49a6c'], spice: ['#d9772f', '#c23b2e', '#e0b84a'],
    tea: ['#6b8f4a', '#8f6b3a', '#c2a45a'], bread: ['#d9a35e', '#c9813c', '#f0c98a'],
    clothes: ['#5a7fb8', '#c45a6b', '#e0c25a'], toys: ['#e85d8a', '#5ab0e8', '#f2c94c'],
    umbrella: ['#c45a6b', '#5a7fb8', '#e0b84a'],
  }[kind] || ['#e85d4a', '#f2a33c', '#8fc24a'];
  if (kind === 'fish') {
    g.fillStyle = 'rgba(210,240,255,.20)'; g.fillRect(-u * .36, -u * .16, u * .72, u * .1);
    for (let i = 0; i < 3; i++) {
      const x = (i - 1) * u * .18;
      sell(g, x, -u * .15, u * .1, u * .035, 0.2, '#bcd6dc');
      g.beginPath(); g.moveTo(x + u * .09, -u * .15); g.lineTo(x + u * .14, -u * .18); g.lineTo(x + u * .14, -u * .12); g.fill();
    }
  } else if (kind === 'meat') {
    for (let i = 0; i < 3; i++) {
      g.strokeStyle = '#9b8b7a'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(-u * .3, -u * .26 + i * u * .08); g.lineTo(u * .3, -u * .26 + i * u * .08); g.stroke();
      sell(g, (i - 1) * u * .14, -u * .22 + i * u * .08, u * .08, u * .025, 0.2, '#c25a50');
    }
  } else if (kind === 'noodles') {
    srr(g, -u * .16, -u * .16, u * .32, u * .12, 4, '#f0e3cc');
    for (let i = 0; i < 4; i++) sline(g, -u * .1, -u * .24 + i * 2.5, u * .1, -u * .25 + i * 2.5, 'rgba(255,255,255,.55)', 1);
    for (let i = 0; i < 4; i++) {
      g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(-u * .05, -u * .2 - i * 4); g.quadraticCurveTo(u * .04, -u * .28 - i * 4, -u * .02, -u * .34 - i * 4); g.stroke();
    }
  } else if (kind === 'clothes' || kind === 'umbrella') {
    for (let i = 0; i < 6; i++) {
      const x = -u * .32 + i * u * .13;
      sline(g, x, -u * .3, x, u * .02, '#b8aa98', 2);
      g.fillStyle = items[i % 3];
      g.beginPath(); g.moveTo(x - u * .06, -u * .24); g.lineTo(x + u * .06, -u * .24); g.lineTo(x + u * .03, -u * .05); g.lineTo(x - u * .03, -u * .05); g.closePath(); g.fill();
    }
  } else if (kind === 'toys') {
    for (let i = 0; i < 6; i++) {
      const x = -u * .3 + (i % 3) * u * .2, y = -u * .1 - Math.floor(i / 3) * u * .09;
      if (i % 2) { g.fillStyle = items[i % 3]; g.beginPath(); g.arc(x, y, u * .05, 0, TAU); g.fill(); }
      else srr(g, x - u * .05, y - u * .04, u * .1, u * .08, 2, items[i % 3]);
    }
  } else if (kind === 'bread') {
    for (let i = 0; i < 5; i++) sell(g, -u * .3 + i * u * .15, -u * .13, u * .07, u * .04, .1, items[i % 3]);
  } else if (kind === 'flowers') {
    for (let i = 0; i < 6; i++) {
      const x = -u * .3 + (i % 3) * u * .2, y = -u * .12 - Math.floor(i / 3) * u * .07;
      sline(g, x, -u * .05, x, y + u * .03, '#4f8f5a', 1);
      sell(g, x, y, u * .04, u * .04, 0, items[i % 3]);
    }
  } else {
    for (let i = 0; i < 8; i++) {
      const x = -u * .32 + (i % 4) * u * .2;
      const y = -u * .12 - Math.floor(i / 4) * u * .08;
      sell(g, x, y, u * .06, u * .05, 0, items[i % 3]);
    }
  }
  // 側邊木箱與價格牌
  srr(g, -u * .5, -u * .1, u * .12, u * .14, 2, '#8a6a42');
  srr(g, u * .38, -u * .08, u * .12, u * .12, 2, '#6b4a30');
  g.fillStyle = '#f4e8d0'; g.font = `700 ${Math.round(u * .035)}px system-ui, sans-serif`;
  g.fillText('$' + (5 + stage), u * .44, -u * .12);
  g.restore();
}

function drawTent(g, u, p) {
  g.fillStyle = p.night ? '#5a7f5a' : '#6fa06a';
  g.beginPath(); g.moveTo(-u * .48, 0); g.lineTo(0, -u * .55); g.lineTo(u * .48, 0); g.closePath(); g.fill();
  g.fillStyle = p.night ? '#365236' : '#477a44';
  g.beginPath(); g.moveTo(-u * .48, 0); g.lineTo(0, -u * .55); g.lineTo(-u * .1, 0); g.closePath(); g.fill();
  g.fillStyle = '#1b271b';
  g.beginPath(); g.moveTo(-u * .1, 0); g.lineTo(0, -u * .22); g.lineTo(u * .1, 0); g.closePath(); g.fill();
  sline(g, 0, -u * .55, 0, 0, 'rgba(255,255,255,.22)', 2);
  sline(g, -u * .48, 0, -u * .58, u * .04, '#c9b89a', 2);
  sline(g, u * .48, 0, u * .58, u * .04, '#c9b89a', 2);
}

function drawCampfire(g, u, p, boss) {
  const r = boss ? u * .26 : u * .18;
  sglow(g, 0, -u * .05, r * 2.4, boss ? 'rgba(255,80,40,.35)' : 'rgba(255,150,50,.32)');
  g.strokeStyle = '#5a3a24'; g.lineWidth = u * .055;
  g.beginPath(); g.moveTo(-u * .26, u * .02); g.lineTo(u * .26, -u * .04); g.stroke();
  g.beginPath(); g.moveTo(-u * .26, -u * .04); g.lineTo(u * .26, u * .02); g.stroke();
  for (let i = 0; i < 3; i++) {
    g.fillStyle = i === 0 ? '#ffdf6b' : i === 1 ? '#ff9a3c' : '#e8452f';
    const h = r * (1.3 - i * .28) + Math.sin(timeAlive * 7 + i) * r * .12;
    g.beginPath();
    g.moveTo(-r * .4, u * .01);
    g.quadraticCurveTo(-r * .3, -h * .6, (i - 1) * r * .18, -h);
    g.quadraticCurveTo(r * .3, -h * .6, r * .4, u * .01);
    g.closePath(); g.fill();
  }
  g.fillStyle = 'rgba(255,230,160,.8)';
  for (let i = 0; i < 8; i++) {
    const a = timeAlive * 1.7 + i;
    g.beginPath(); g.arc(Math.sin(a) * r * .5, -r * .8 - (i % 3) * 8, 1.4, 0, TAU); g.fill();
  }
}

function drawNeon(g, u, p, glow) {
  // 招牌底板
  srr(g, -u * .42, -u * .16, u * .84, u * .26, 5, 'rgba(10,8,14,.72)');
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2;
  g.strokeRect(-u * .42, -u * .16, u * .84, u * .26);
  sline(g, -u * .34, -u * .16, -u * .34, -u * .28, '#6b6b72', 3);
  sline(g, u * .34, -u * .16, u * .34, -u * .28, '#6b6b72', 3);
  g.save();
  g.font = `800 ${Math.round(u * .17)}px system-ui, sans-serif`;
  g.textAlign = 'center';
  g.shadowColor = glow; g.shadowBlur = u * .2;
  g.strokeStyle = glow; g.lineWidth = u * .018;
  g.strokeText('OPEN', 0, 0);
  g.fillStyle = p.night ? '#f6d6ff' : '#ffd6f0';
  g.fillText('OPEN', 0, 0);
  g.restore();
  // 下方小字
  g.fillStyle = 'rgba(255,255,255,.55)'; g.font = `600 ${Math.round(u * .035)}px system-ui`;
  g.textAlign = 'center'; g.fillText('24H', 0, -u * .2);
}

function drawBreadItem(g, u, kind, p) {
  sell(g, 0, u * .03, u * .36, u * .07, 0, 'rgba(0,0,0,.18)');
  sell(g, 0, -u * .02, u * .34, u * .06, 0, '#d8c7b2');
  if (kind === 'baguette') {
    for (let i = 0; i < 3; i++) {
      sell(g, (i - 1) * u * .12, -u * .1, u * .18, u * .045, .2, '#d9a35e');
      sline(g, (i - 1) * u * .12 - u * .1, -u * .12, (i - 1) * u * .12 + u * .1, -u * .08, '#b07a3d', 1);
    }
  } else if (kind === 'cookie') {
    for (let i = 0; i < 3; i++) {
      const x = (i - 1) * u * .17;
      sell(g, x, -u * .08, u * .1, u * .09, 0, '#d9a35e');
      g.fillStyle = '#5a3d28';
      for (let j = 0; j < 4; j++) g.beginPath(), g.arc(x + Math.cos(j * 1.8) * u * .04, -u * .08 + Math.sin(j * 1.8) * u * .035, 1.5, 0, TAU), g.fill();
    }
  } else if (kind === 'pretzel') {
    for (let i = 0; i < 2; i++) {
      const x = (i - .5) * u * .22;
      g.strokeStyle = '#b07a3d'; g.lineWidth = u * .04;
      g.beginPath(); g.arc(x, -u * .08, u * .09, Math.PI * .2, Math.PI * 1.8); g.stroke();
      g.beginPath(); g.arc(x, -u * .16, u * .05, 0, TAU); g.stroke();
    }
  } else if (kind === 'eclair') {
    for (let i = 0; i < 2; i++) {
      srr(g, (i - 1) * u * .15 - u * .1, -u * .12, u * .2, u * .08, 4, '#c9813c');
      srr(g, (i - 1) * u * .15 - u * .1, -u * .15, u * .2, u * .04, 3, '#5a3d28');
    }
  } else if (kind === 'muffin') {
    for (let i = 0; i < 3; i++) {
      const x = (i - 1) * u * .16;
      srr(g, x - u * .06, -u * .1, u * .12, u * .1, 3, '#c9a04a');
      sell(g, x, -u * .12, u * .08, u * .06, 0, '#a9703d');
    }
  } else if (kind === 'waffle') {
    srr(g, -u * .13, -u * .2, u * .26, u * .2, 5, '#d9a35e');
    g.strokeStyle = '#a9703d'; g.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      sline(g, -u * .13 + i * u * .09, -u * .2, -u * .13 + i * u * .09, 0, '#a9703d', 1);
      sline(g, -u * .13, -u * .2 + i * u * .07, u * .13, -u * .2 + i * u * .07, '#a9703d', 1);
    }
  } else if (kind === 'cakePop') {
    for (let i = 0; i < 3; i++) {
      const x = (i - 1) * u * .15;
      sline(g, x, u * .03, x, -u * .12, '#c9b89a', 2);
      g.fillStyle = [p.accent, p.accent2, '#f2c94c'][i];
      g.beginPath(); g.arc(x, -u * .16, u * .06, 0, TAU); g.fill();
    }
  }
}

function drawProp(g, kind, x, y, sc, spec) {
  const u = spec.u * sc;
  const p = spec.pal;
  g.save();
  g.translate(x, y);
  switch (kind) {
    case 'watermelon':
      drawWatermelonAt(g, 0, 0, u * .38, p);
      break;
    case 'tv': {
      srr(g, -u * .5, -u * .4, u, u * .55, 6, '#14161a');
      const sg = g.createLinearGradient(0, -u * .35, 0, u * .12);
      sg.addColorStop(0, p.night ? '#1b3b5a' : '#7fc8e8');
      sg.addColorStop(1, p.night ? '#0b1626' : '#d8f0ff');
      srr(g, -u * .44, -u * .34, u * .88, u * .43, 3, sg);
      // 螢幕內容：太陽、山、掃描線
      sell(g, u * .2, -u * .24, u * .06, u * .06, 0, 'rgba(255,240,180,.9)');
      g.fillStyle = p.night ? 'rgba(30,60,90,.6)' : 'rgba(70,130,90,.55)';
      g.beginPath(); g.moveTo(-u * .44, u * .02); g.lineTo(-u * .2, -u * .16); g.lineTo(0, u * .02); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(-u * .1, u * .02); g.lineTo(u * .16, -u * .2); g.lineTo(u * .44, u * .02); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1;
      for (let y = -u * .3; y < u * .08; y += u * .035) { g.beginPath(); g.moveTo(-u * .44, y); g.lineTo(u * .44, y); g.stroke(); }
      g.fillStyle = 'rgba(255,255,255,.2)';
      g.beginPath(); g.moveTo(-u * .38, -u * .3); g.lineTo(-u * .15, -u * .3); g.lineTo(-u * .36, u * .02); g.lineTo(-u * .44, u * .02); g.fill();
      srr(g, -u * .16, u * .2, u * .32, u * .05, 2, '#2b2b30');
      srr(g, -u * .28, u * .24, u * .56, u * .04, 2, '#1b1b1f');
      break;
    }
    case 'fishTank': {
      srr(g, -u * .36, -u * .4, u * .72, u * .5, 5, 'rgba(170,230,255,.22)');
      g.strokeStyle = 'rgba(220,250,255,.55)'; g.lineWidth = 2;
      g.strokeRect(-u * .36, -u * .4, u * .72, u * .5);
      g.fillStyle = 'rgba(120,190,220,.22)'; g.fillRect(-u * .33, -u * .1, u * .66, u * .18);
      for (let i = 0; i < 4; i++) {
        const fx = -u * .22 + i * u * .15, fy = -u * .22 + Math.sin(timeAlive * 1.6 + i) * u * .05;
        sell(g, fx, fy, u * .055, u * .028, .2, i % 2 ? '#ffcf6b' : '#ff8a6b');
        g.beginPath(); g.moveTo(fx + u * .05, fy); g.lineTo(fx + u * .085, fy - u * .025); g.lineTo(fx + u * .085, fy + u * .025); g.fill();
      }
      srr(g, -u * .3, u * .1, u * .6, u * .06, 2, '#6b4a30');
      break;
    }
    case 'catTree': {
      srr(g, -u * .3, -u * .05, u * .6, u * .07, 3, '#a98a68');
      srr(g, -u * .08, -u * .35, u * .16, u * .32, 3, '#a98a68');
      srr(g, -u * .3, -u * .42, u * .34, u * .1, 4, '#c9b89a');
      drawCat(g, u * .78, p, true);
      break;
    }
    case 'fan': {
      sline(g, 0, u * .04, 0, -u * .18, '#8a8f96', u * .035);
      g.fillStyle = '#b9c0c6';
      g.beginPath(); g.arc(0, -u * .22, u * .09, 0, TAU); g.fill();
      for (let i = 0; i < 4; i++) {
        g.save(); g.rotate(i * TAU / 4 + timeAlive * .4);
        sell(g, u * .13, 0, u * .13, u * .07, 0, 'rgba(220,230,235,.55)');
        g.restore();
      }
      srr(g, -u * .18, u * .04, u * .36, u * .04, 2, '#6b7078');
      break;
    }
    case 'ceilingFan': {
      sline(g, 0, -u * .5, 0, -u * .1, '#6b5a4a', 3);
      g.fillStyle = '#8a7a66'; g.beginPath(); g.arc(0, -u * .06, u * .08, 0, TAU); g.fill();
      for (let i = 0; i < 4; i++) {
        g.save(); g.rotate(i * TAU / 4 + timeAlive * .3);
        sell(g, u * .2, -u * .06, u * .2, u * .045, 0, 'rgba(160,130,100,.8)');
        g.restore();
      }
      break;
    }
    case 'piano': {
      srr(g, -u * .45, -u * .2, u * .9, u * .16, 4, '#2a2320');
      srr(g, -u * .45, -u * .05, u * .88, u * .22, 3, '#1c1816');
      g.fillStyle = '#f4ecd8'; g.fillRect(-u * .38, -u * .15, u * .72, u * .06);
      for (let i = 0; i < 14; i++) sline(g, -u * .38 + i * u * .052, -u * .15, -u * .38 + i * u * .052, -u * .09, '#2a2320', 1);
      srr(g, -u * .36, u * .14, u * .07, u * .22, 2, '#2a2320');
      srr(g, u * .28, u * .14, u * .07, u * .22, 2, '#2a2320');
      break;
    }
    case 'bookshelf': {
      srr(g, -u * .42, -u * .55, u * .84, u * .58, 4, '#6b4a30');
      for (let r = 0; r < 3; r++) {
        g.fillStyle = '#8a5a30'; g.fillRect(-u * .39, -u * .47 + r * u * .18, u * .78, u * .025);
        for (let i = 0; i < 8; i++) {
          g.fillStyle = ['#c45a4a', '#5a7fb8', '#c9a04a', '#4f8f5a', '#8a6bb0'][(i + r) % 5];
          g.fillRect(-u * .36 + i * u * .09, -u * .44 + r * u * .18, u * .06, u * .13);
        }
      }
      break;
    }
    case 'birthday': {
      drawCakeAt(g, u * .72, p, 'cake');
      for (let i = 0; i < 6; i++) {
        const bx = -u * .38 + (i % 3) * u * .34, by = -u * .55 - Math.floor(i / 3) * u * .18;
        g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(bx, by + u * .1); g.lineTo(bx, by); g.stroke();
        sell(g, bx, by, u * .06, u * .075, 0, i % 2 ? p.accent : p.accent2);
      }
      break;
    }
    case 'xmas': {
      g.fillStyle = '#2f5a38';
      g.beginPath(); g.moveTo(0, -u * .55); g.lineTo(-u * .3, -u * .05); g.lineTo(u * .3, -u * .05); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(0, -u * .4); g.lineTo(-u * .38, u * .04); g.lineTo(u * .38, u * .04); g.closePath(); g.fill();
      g.fillStyle = '#f2c94c';
      for (let i = 0; i < 9; i++) {
        const a = i * 2.1;
        g.beginPath(); g.arc(Math.cos(a) * u * .2, -u * .18 + Math.sin(a) * u * .18, u * .018, 0, TAU); g.fill();
      }
      g.fillStyle = '#c45a4a'; g.fillRect(-u * .24, -u * .02, u * .1, u * .08);
      g.fillStyle = '#5a7fb8'; g.fillRect(u * .12, u * .01, u * .09, u * .07);
      break;
    }
    case 'bossNest': {
      // 破布與紙箱堆成的巢，不再畫第二雙紅眼（Boss 本體在畫面上方）
      for (let i = 0; i < 9; i++) {
        g.fillStyle = i % 2 ? '#2a1a1a' : '#3a2020';
        g.beginPath(); g.ellipse((i - 4) * u * .1, u * .02 - (i % 3) * u * .025, u * .12, u * .04, .15, 0, TAU); g.fill();

      g.strokeStyle = p.accent2; g.lineWidth = u * .02;
      g.beginPath(); g.arc(u * .2, -u * .1, u * .12, 0, TAU); g.stroke();
      break;
    }
    case 'crates': {
      for (let i = 0; i < 3; i++) {
        srr(g, -u * .28 + i * u * .1, -u * .1 - (i % 2) * u * .12, u * .24, u * .16, 2, i % 2 ? '#8a6a42' : '#6b4a30');
      }
      break;
    }
    case 'trashbags': {
      for (let i = 0; i < 4; i++) {
        sell(g, (i - 1.5) * u * .13, -u * .05, u * .1, u * .13, 0, '#1d2328');
        g.fillStyle = 'rgba(255,255,255,.08)';
        g.beginPath(); g.arc((i - 1.5) * u * .13, -u * .1, u * .04, 0, TAU); g.fill();
      }
      break;
    }
    case 'fireEscape': {
      g.strokeStyle = '#2a2a2e'; g.lineWidth = u * .04;
      g.strokeRect(-u * .3, -u * .45, u * .6, u * .5);
      for (let i = 0; i < 3; i++) sline(g, -u * .3, -u * .3 + i * u * .15, u * .3, -u * .3 + i * u * .15, '#2a2a2e', 2);
      break;
    }
    case 'backdoor': {
      srr(g, -u * .2, -u * .4, u * .4, u * .44, 2, '#3a2a20');
      g.fillStyle = '#c9a04a'; g.beginPath(); g.arc(u * .12, -u * .18, u * .018, 0, TAU); g.fill();
      break;
    }
    case 'bossThrone': {
      g.fillStyle = 'rgba(0,0,0,.32)';
      g.beginPath(); g.ellipse(0, u * .04, u * .3, u * .05, 0, 0, TAU); g.fill();
      // 高背椅
      srr(g, -u * .22, -u * .42, u * .44, u * .34, 8, '#2a1818');
      srr(g, -u * .26, -u * .12, u * .52, u * .14, 6, '#3a2020');
      srr(g, -u * .3, -u * .14, u * .1, u * .2, 4, '#2a1818');
      srr(g, u * .2, -u * .14, u * .1, u * .2, 4, '#2a1818');
      // 紅坐墊
      srr(g, -u * .22, -u * .12, u * .44, u * .08, 3, '#6b1f1f');
      // 扶手尖刺
      for (const sx of [-1, 1]) {
        g.fillStyle = '#4a2a2a';
        g.beginPath(); g.moveTo(sx * u * .28, -u * .14); g.lineTo(sx * u * .33, -u * .26); g.lineTo(sx * u * .24, -u * .22); g.closePath(); g.fill();
      }
      // 眼睛
      g.fillStyle = 'rgba(255,50,50,.85)';
      g.beginPath(); g.arc(-u * .1, -u * .3, u * .025, 0, TAU); g.fill();
      g.beginPath(); g.arc(u * .1, -u * .3, u * .025, 0, TAU); g.fill();
      break;
    }
    case 'vending': {
      srr(g, -u * .2, -u * .45, u * .4, u * .5, 3, '#3a4a5a');
      srr(g, -u * .15, -u * .4, u * .3, u * .26, 2, 'rgba(200,240,255,.2)');
      for (let i = 0; i < 6; i++) srr(g, -u * .1 + (i % 2) * u * .1, -u * .36 + Math.floor(i / 2) * u * .08, u * .07, u * .06, 1, i % 2 ? '#e85d4a' : '#5ab0e8');
      break;
    }
    case 'scooter': {
      g.strokeStyle = '#2a2a2e'; g.lineWidth = u * .04;
      g.beginPath(); g.arc(-u * .22, u * .02, u * .08, 0, TAU); g.stroke();
      g.beginPath(); g.arc(u * .24, u * .02, u * .08, 0, TAU); g.stroke();
      srr(g, -u * .2, -u * .18, u * .4, u * .1, 4, '#b04a3a');
      sline(g, -u * .12, -u * .18, u * .04, -u * .3, '#8a3a2a', 2);
      srr(g, -u * .26, -u * .32, u * .1, u * .05, 2, '#2a2a2e');
      break;
    }
    case 'steamVent': {
      for (let i = 0; i < 3; i++) {
        g.fillStyle = `rgba(220,230,235,${.08 + i * .04})`;
        g.beginPath(); g.arc(0, -u * .1 - i * u * .08 + Math.sin(timeAlive + i) * 3, u * (.1 + i * .04), 0, TAU); g.fill();
      }
      srr(g, -u * .12, u * .02, u * .24, u * .04, 2, '#4a4a4a');
      break;
    }
    case 'barrels': {
      for (let i = 0; i < 3; i++) {
        srr(g, -u * .3 + i * u * .2, -u * .2, u * .16, u * .24, 4, i % 2 ? '#5a6b72' : '#3a4a52');
        sline(g, -u * .3 + i * u * .2, -u * .12, -u * .14 + i * u * .2, -u * .12, 'rgba(255,255,255,.18)', 2);
      }
      break;
    }
    case 'bike': {
      g.strokeStyle = '#2a2a2e'; g.lineWidth = u * .035;
      g.beginPath(); g.arc(-u * .22, u * .02, u * .1, 0, TAU); g.stroke();
      g.beginPath(); g.arc(u * .22, u * .02, u * .1, 0, TAU); g.stroke();
      sline(g, -u * .22, u * .02, 0, -u * .16, p.accent, 3);
      sline(g, u * .22, u * .02, 0, -u * .16, p.accent, 3);
      sline(g, 0, -u * .16, u * .1, -u * .3, p.accent, 3);
      break;
    }
    case 'cage': {
      g.strokeStyle = '#5a6b72'; g.lineWidth = 2;
      g.strokeRect(-u * .22, -u * .24, u * .44, u * .3);
      for (let i = 0; i < 4; i++) sline(g, -u * .16 + i * u * .1, -u * .24, -u * .16 + i * u * .1, u * .06, '#5a6b72', 1);
      break;
    }
    case 'signs': {
      sline(g, 0, u * .04, 0, -u * .3, '#6b6b6b', 2);
      srr(g, -u * .2, -u * .3, u * .4, u * .12, 2, '#d8c7b2');
      srr(g, -u * .16, -u * .16, u * .32, u * .1, 2, '#c9a04a');
      break;
    }
    case 'drain': {
      sell(g, 0, u * .03, u * .24, u * .06, 0, '#111417');
      for (let i = 0; i < 5; i++) sline(g, -u * .16 + i * u * .08, u * .01, -u * .16 + i * u * .08, u * .05, '#666', 2);
      g.strokeStyle = 'rgba(170,210,230,.35)'; g.lineWidth = 2;
      g.beginPath(); g.arc(0, u * .03, u * .12, 0, Math.PI); g.stroke();
      for (let i = 0; i < 3; i++) {
        g.fillStyle = `rgba(200,220,230,${.06 + i * .03})`;
        g.beginPath(); g.arc(u * .05, -u * .04 - i * 5, u * (.05 + i * .015), 0, TAU); g.fill();
      }
      break;
    }
    case 'rat': {
      sell(g, 0, u * .02, u * .12, u * .06, 0, '#4a4a4a');
      g.beginPath(); g.arc(u * .12, -u * .02, u * .04, 0, TAU); g.fillStyle = '#4a4a4a'; g.fill();
      sline(g, -u * .12, u * .02, -u * .26, -u * .02, '#4a4a4a', 2);
      break;
    }
    case 'stallFruit': case 'stallFish': case 'stallMeat': case 'stallVeg':
    case 'stallNoodles': case 'stallFlowers': case 'stallEggs': case 'stallSpice':
    case 'stallTea': case 'stallBread': case 'stallClothes': case 'stallToys':
    case 'stallUmbrella':
      drawStall(g, u, kind.replace('stall', '').toLowerCase(), p, spec.stage);
      break;
    case 'bossMarket':
      drawStall(g, u, 'meat', p, spec.stage);
      g.fillStyle = 'rgba(255,50,50,.8)';
      g.beginPath(); g.arc(-u * .12, -u * .36, u * .025, 0, TAU); g.fill();
      g.beginPath(); g.arc(u * .12, -u * .36, u * .025, 0, TAU); g.fill();
      break;
    case 'lanterns':
      for (let i = 0; i < 5; i++) {
        const lx = -u * .38 + i * u * .19, ly = -u * .28 + Math.sin(i + timeAlive) * u * .015;
        sline(g, lx, -u * .5, lx, ly, 'rgba(255,220,160,.35)', 1);
        sell(g, lx, ly, u * .055, u * .075, 0, i % 2 ? '#e85d4a' : '#f2c94c');
        sglow(g, lx, ly, u * .2, 'rgba(255,180,90,.18)');
      }
      break;
    case 'chicken':
      srr(g, -u * .26, -u * .26, u * .52, u * .3, 3, 'rgba(120,90,60,.35)');
      g.strokeStyle = '#8a7a66'; g.lineWidth = 2;
      g.strokeRect(-u * .26, -u * .26, u * .52, u * .3);
      for (let i = 0; i < 4; i++) sline(g, -u * .18 + i * u * .12, -u * .26, -u * .18 + i * u * .12, u * .04, '#8a7a66', 1);
      sell(g, 0, -u * .02, u * .1, u * .09, 0, '#f2e6d0');
      g.fillStyle = '#d94f4f'; g.beginPath(); g.arc(u * .06, -u * .12, u * .02, 0, TAU); g.fill();
      g.fillStyle = '#f2c94c'; g.beginPath(); g.moveTo(u * .1, -u * .04); g.lineTo(u * .16, -u * .02); g.lineTo(u * .1, 0); g.fill();
      break;
    case 'iceCart':
      srr(g, -u * .32, -u * .18, u * .64, u * .24, 5, '#d8e4e6');
      srr(g, -u * .36, -u * .22, u * .72, u * .06, 3, '#5a7fb8');
      g.fillStyle = 'rgba(180,230,250,.7)';
      g.beginPath(); g.moveTo(-u * .1, -u * .18); g.lineTo(u * .16, -u * .18); g.lineTo(u * .08, -u * .34); g.lineTo(-u * .02, -u * .3); g.closePath(); g.fill();
      g.strokeStyle = '#555'; g.lineWidth = 3;
      g.beginPath(); g.arc(-u * .2, u * .08, u * .06, 0, TAU); g.stroke();
      g.beginPath(); g.arc(u * .2, u * .08, u * .06, 0, TAU); g.stroke();
      break;
    case 'closedStalls':
      for (let i = 0; i < 3; i++) {
        srr(g, -u * .4 + i * u * .28, -u * .35, u * .24, u * .4, 2, 'rgba(90,90,90,.55)');
        for (let j = 0; j < 5; j++) sline(g, -u * .4 + i * u * .28, -u * .3 + j * u * .08, -u * .16 + i * u * .28, -u * .3 + j * u * .08, 'rgba(220,220,220,.16)', 1);
      }
      break;
    case 'cake': case 'weddingCake': case 'donut': case 'tart': case 'pie': case 'macaron':
      drawCakeAt(g, u, p, kind);
      break;
    case 'cinnamon':
      drawCakeAt(g, u, p, 'cake');
      g.strokeStyle = '#a9703d'; g.lineWidth = 2;
      for (let i = 0; i < 2; i++) {
        g.beginPath(); g.arc(0, -u * .2 - i * u * .1, u * .08, 0, TAU * .8); g.stroke();
      }
      break;
    case 'breadRack':
      srr(g, -u * .42, -u * .3, u * .84, u * .34, 3, '#6b4a30');
      for (let r = 0; r < 2; r++) {
        g.fillStyle = '#8a5a30'; g.fillRect(-u * .38, -u * .18 + r * u * .14, u * .76, u * .025);
        for (let i = 0; i < 5; i++) sell(g, -u * .3 + i * u * .15, -u * .2 + r * u * .14, u * .07, u * .04, .1, '#d9a35e');
      }
      break;
    case 'baguette': case 'cookie': case 'pretzel': case 'eclair': case 'muffin': case 'waffle': case 'cakePop':
      drawBreadItem(g, u, kind, p);
      break;
    case 'coffee':
      srr(g, -u * .24, -u * .35, u * .48, u * .38, 5, '#4a4a4e');
      srr(g, -u * .18, -u * .4, u * .36, u * .1, 3, '#8a8f96');
      g.fillStyle = '#d8e4e6'; g.fillRect(-u * .12, -u * .16, u * .24, u * .1);
      srr(g, -u * .08, -u * .06, u * .16, u * .12, 2, '#f0e3cc');
      for (let i = 0; i < 3; i++) {
        g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, -u * .4 - i * 4); g.quadraticCurveTo(u * .05, -u * .45 - i * 4, 0, -u * .5 - i * 4); g.stroke();
      }
      break;
    case 'chalkboard':
      srr(g, -u * .34, -u * .32, u * .68, u * .36, 2, '#2a2a2a');
      g.strokeStyle = '#8a6a42'; g.lineWidth = 4; g.strokeRect(-u * .34, -u * .32, u * .68, u * .36);
      g.fillStyle = 'rgba(255,255,255,.5)';
      for (let i = 0; i < 4; i++) g.fillRect(-u * .26, -u * .24 + i * u * .07, u * (.3 + (i % 2) * .15), 1.5);
      break;
    case 'register':
      srr(g, -u * .26, -u * .2, u * .52, u * .22, 3, '#5a5a60');
      srr(g, -u * .2, -u * .34, u * .4, u * .14, 2, '#2a2a30');
      g.fillStyle = 'rgba(160,230,190,.7)'; g.fillRect(-u * .16, -u * .31, u * .32, u * .08);
      for (let i = 0; i < 6; i++) srr(g, -u * .2 + (i % 3) * u * .14, -u * .14 + Math.floor(i / 3) * u * .05, u * .09, u * .03, 1, '#b8b8c0');
      break;
    case 'bossOven':
      srr(g, -u * .38, -u * .35, u * .76, u * .45, 4, '#3a2a24');
      srr(g, -u * .28, -u * .24, u * .56, u * .24, 3, 'rgba(255,90,30,.55)');
      sglow(g, 0, -u * .12, u * .38, 'rgba(255,90,20,.35)');
      g.fillStyle = 'rgba(255,60,30,.8)';
      g.beginPath(); g.arc(-u * .12, -u * .2, u * .025, 0, TAU); g.fill();
      g.beginPath(); g.arc(u * .12, -u * .2, u * .025, 0, TAU); g.fill();
      break;
    case 'tent':
      drawTent(g, u, p);
      break;
    case 'campfire':
      drawCampfire(g, u, p, false);
      break;
    case 'bossBonfire':
      drawCampfire(g, u, p, true);
      break;
    case 'croissant': {
      const t = defendTarget();
      g.restore();
      drawCroissantAt(g, t.x, t.y, t.r, p);
      g.save(); g.translate(x, y);
      break;
    }
    default:
      srr(g, -u * .18, -u * .16, u * .36, u * .2, 3, p.accent2);
  }
  g.restore();
}

/* 蛋糕/麵包類：用同一個繪製器吃不同 type */
function drawBakery(g, kind, x, y, sc, spec) {
  drawCakeAt(g, spec.u * sc, spec.pal, kind);
}

function drawCroissantAt(g, x, y, r, p) {
  g.save();
  g.translate(x, y);
  // 盤子
  sell(g, 0, r * .55, r * 1.25, r * .22, 0, 'rgba(0,0,0,.18)');
  sell(g, 0, r * .48, r * 1.2, r * .2, 0, '#f0e3cc');
  // 可頌身體（新月形）
  const body = new Path2D();
  body.moveTo(-r * 1.05, r * .05);
  body.quadraticCurveTo(-r * .7, -r * .62, 0, -r * .5);
  body.quadraticCurveTo(r * .7, -r * .62, r * 1.05, r * .05);
  body.quadraticCurveTo(r * .55, r * .5, 0, r * .42);
  body.quadraticCurveTo(-r * .55, r * .5, -r * 1.05, r * .05);
  body.closePath();
  const grad = g.createLinearGradient(0, -r * .5, 0, r * .45);
  grad.addColorStop(0, '#e8b26a'); grad.addColorStop(1, '#c9813c');
  g.fillStyle = grad; g.fill(body);
  g.strokeStyle = 'rgba(140,75,25,.55)'; g.lineWidth = Math.max(1, r * .025); g.stroke(body);
  // 層次紋路
  for (let i = -2; i <= 2; i++) {
    g.strokeStyle = 'rgba(150,85,30,.45)'; g.lineWidth = Math.max(1, r * .03);
    g.beginPath();
    g.arc(i * r * .28, -r * .02, r * .2, Math.PI * .12, Math.PI * .88);
    g.stroke();
  }
  // 草莓
  for (let i = 0; i < 5; i++) {
    const sx = Math.cos(i * 1.55) * r * .52;
    const sy = -r * .18 + Math.sin(i * 2.1) * r * .12;
    g.fillStyle = '#d63b4a';
    g.beginPath(); g.arc(sx, sy, r * .11, 0, TAU); g.fill();
    g.fillStyle = '#f7a0a8';
    g.beginPath(); g.arc(sx - r * .03, sy - r * .03, r * .035, 0, TAU); g.fill();
  }
  g.restore();
}

function drawStaticScene(g, spec, w, h) {
  spec.w = w; spec.h = h; spec.u = Math.min(w, h * .8);
  const cfg = LEVELS[spec.n] || {};
  g.clearRect(0, 0, w, h);
  if (spec.chapter === 1) baseLiving(g, spec, w, h);
  else if (spec.chapter === 2) baseMarket(g, spec, w, h);
  else if (spec.chapter === 3) baseBakery(g, spec, w, h);
  else if (spec.chapter === 4) baseCamp(g, spec, w, h);
  else baseAlley(g, spec, w, h);

  const wallProps = new Set(['window', 'picture', 'clock', 'shelf', 'lamp', 'neon', 'graffiti', 'starmap', 'trailSign', 'chalkboard', 'signs', 'fireEscape', 'pipes']);
  const backProps = spec.props.slice(0, 2);
  backProps.forEach((kind, i) => {
    const wall = wallProps.has(kind);
    const bakery = spec.chapter === 3;
    const px = wall ? (i % 2 ? w * .76 : w * .24)
      : bakery ? (i % 2 ? w * .9 : w * .1) : (i % 2 ? w * .82 : w * .18);
    const py = wall ? h * .42 : bakery ? h * .55 : h * .60;
    const ps = wall ? 0.5 : bakery ? 0.32 : 0.45;
    drawProp(g, kind, px, py, ps, spec);
  });

  const wallFocal = wallProps.has(spec.focal) || spec.focal === 'ceilingFan';
  let fy = wallFocal ? h * .42 : h * .72;
  if (spec.focal === 'ceilingFan') fy = h * .16;
  if (spec.chapter === 3 && !wallFocal) fy = h * .62;
  if (spec.chapter === 4 && ['lake', 'mountain', 'waterfall', 'bridge'].includes(spec.focal)) fy = h * .6;
  let fsc = 1.0;
  if (spec.chapter === 1) fsc = 1.06;
  if (spec.focal === 'tv') { fsc = 0.82; fy = h * .38; }
  else if (spec.chapter === 2) fsc = 0.95;
  else if (spec.chapter === 3) fsc = 0.95;
  else if (spec.chapter === 4) fsc = 1.1;
  else fsc = 0.95;
  if (spec.chapter === 4 && ['lake', 'mountain', 'waterfall', 'bridge'].includes(spec.focal)) fsc = 1.45;
  if (spec.focal !== 'watermelon' && spec.focal !== 'croissant') drawProp(g, spec.focal, w / 2, fy, fsc, spec);

  if (cfg.defend) {
    const t = defendTarget();
    drawCroissantAt(g, t.x, t.y, t.r, spec.pal);
  }
  if (cfg.boss) {
    const aura = g.createRadialGradient(w / 2, h * .6, 10, w / 2, h * .6, Math.max(w, h) * .7);
    aura.addColorStop(0, 'rgba(120,0,0,0)');
    aura.addColorStop(1, 'rgba(90,0,0,.30)');
    g.fillStyle = aura; g.fillRect(0, 0, w, h);
  }
  g.fillStyle = spec.pal.tint; g.fillRect(0, 0, w, h);
  const vig = g.createRadialGradient(w / 2, h * .45, Math.min(w, h) * .25, w / 2, h * .5, Math.max(w, h) * .75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.28)');
  g.fillStyle = vig; g.fillRect(0, 0, w, h);
}

function drawSceneFx(spec, w, h) {
  const t = timeAlive;
  if (!spec) return;
  if (spec.time.id === 'rain' || spec.time.id === 'neon') {
    g.strokeStyle = 'rgba(170,210,235,.16)'; g.lineWidth = 1.2;
    for (let i = 0; i < 45; i++) {
      const rx = ((i * 97 + t * 620) % (w + 60)) - 30;
      const ry = ((i * 53 + t * 900) % (h + 80)) - 40;
      g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx - 5, ry + 18); g.stroke();
    }
  }
  if (spec.chapter === 4 && spec.time.id === 'day') {
    for (let i = 0; i < 10; i++) {
      const px = (i * 83 + t * 18) % w, py = h * (.3 + ((i * 31) % 35) / 100);
      g.fillStyle = 'rgba(255,250,190,.22)';
      g.beginPath(); g.arc(px, py, 1.2, 0, TAU); g.fill();
    }
  }
  if (spec.chapter === 4 && spec.focal === 'campfire') {
    sglow(g, w / 2, h * .7, Math.min(w, h) * .4, `rgba(255,140,40,${.05 + .025 * Math.sin(t * 6)})`);
  }
}

function drawBackground() {
  const n = state.level || 1;
  const key = `${n}|${Math.round(W)}|${Math.round(H)}|${DPR}`;
  if (bgCache.key !== key || !bgCache.canvas) {
    const spec = sceneFor(n);
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.floor(W * DPR));
    cv.height = Math.max(1, Math.floor(H * DPR));
    const g = cv.getContext('2d');
    g.scale(DPR, DPR);
    drawStaticScene(g, spec, W, H);
    bgCache = { key, canvas: cv, spec };
  }
  ctx.drawImage(bgCache.canvas, 0, 0, W, H);
  drawSceneFx(bgCache.spec, W, H);

  // 突風視覺
  if (state.wind) {
    ctx.strokeStyle = 'rgba(200, 230, 255, .22)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const y = (i / 12) * H;
      const off = (timeAlive * 900 * state.wind.dir) % 120;
      ctx.beginPath();
      ctx.moveTo(((off + i * 40) % (W + 120)) - 60, y);
      ctx.lineTo(((off + i * 40) % (W + 120)) - 60 + 70 * state.wind.dir, y - 8);
      ctx.stroke();
    }
  }
}

/* ==================================================================== *
 * 9. 蒼蠅繪製
 * ==================================================================== */
function drawFly(f) {
  ctx.save();
  const moving = f.state === 'fly' || (f.isBoss && (f.dive || f.stunT > 0));
  let alpha = clamp(f.alpha, 0, 1);
  if (f.camo && !moving && !f.eating) alpha *= 0.2;          // 金斑麗蠅：靜止近乎隱形
  if (f.frozenT > 0) alpha *= 0.85;
  ctx.globalAlpha = alpha;
  ctx.translate(f.x, f.y);
  const r = f.r;
  if (f.spawnT > 0) {
    const k = 1 - f.spawnT / 0.25;
    ctx.scale(0.4 + 0.6 * k, 0.4 + 0.6 * k);
  }

  const boss = f.isBoss;
  const phase2 = boss && f.phase === 2;
  const bodyColor = f.hpFlash > 0 ? '#ffffff' : (boss ? (phase2 ? '#7a1f1f' : '#5a2020') : f.T.color);

  ctx.globalAlpha = alpha * 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, r * 1.5, r * 0.9, r * 0.3, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = alpha;

  // 翅膀
  const flapK = f.state === 'rest' ? 0.15 : Math.abs(Math.sin(f.flap)) * 0.85 + 0.15;
  ctx.fillStyle = 'rgba(220, 235, 255, .38)';
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.rotate(side * (0.5 + flapK * 0.5));
    ctx.beginPath();
    ctx.ellipse(side * r * 0.7, -r * 0.55, r * 0.95, r * 0.42, side * 0.4, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // 身體
  const bg = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.15, 0, 0, r * 1.15);
  bg.addColorStop(0, boss ? (phase2 ? '#c05252' : '#a03a3a') : (f.friendly ? '#ffd35c' : '#7c7c86'));
  bg.addColorStop(1, bodyColor);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.86, 0, 0, TAU); ctx.fill();

  // 蜜蜂條紋
  if (f.friendly) {
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.86, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = 'rgba(40, 30, 20, .85)';
    for (let i = -2; i <= 2; i++) ctx.fillRect(i * r * 0.45, -r, r * 0.2, r * 2);
    ctx.restore();
    ctx.fillStyle = '#ffd35c';
    ctx.font = `700 ${Math.round(r * 1.1)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText('♡', 0, -r * 0.9);
  }

  // 頭 + 眼睛
  const headR = r * 0.55;
  ctx.fillStyle = boss ? '#3d1414' : (f.friendly ? '#3b2c12' : '#2b2b30');
  ctx.beginPath(); ctx.arc(0, -r * 0.62, headR, 0, TAU); ctx.fill();
  ctx.fillStyle = phase2 ? '#ff3030' : (boss ? '#ff4a4a' : '#d94f4f');
  const eyeOff = headR * 0.62;
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.arc(side * eyeOff, -r * 0.74, headR * (phase2 ? 0.58 : 0.5), 0, TAU); ctx.fill();
  }
  if (boss) {
    ctx.fillStyle = phase2 ? '#ff8a5c' : '#ffd166';
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 1.12);
    ctx.lineTo(-r * 0.2, -r * 1.5);
    ctx.lineTo(0, -r * 1.15);
    ctx.lineTo(r * 0.2, -r * 1.5);
    ctx.lineTo(r * 0.5, -r * 1.12);
    ctx.closePath(); ctx.fill();
    if (f.shieldCount > 0) {
      ctx.strokeStyle = 'rgba(127, 212, 255, .75)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.35, 0, TAU); ctx.stroke();
    }
  }
  // 腳
  ctx.strokeStyle = 'rgba(20,20,24,.8)';
  ctx.lineWidth = Math.max(1.2, r * 0.11);
  const jitter = f.state === 'rest' ? Math.sin(f.legPhase) * r * 0.22 : 0;
  for (let i = -1; i <= 1; i++) {
    const bx = i * r * 0.42;
    ctx.beginPath();
    ctx.moveTo(bx, r * 0.2);
    ctx.lineTo(bx + i * r * 0.2 + jitter, r * 0.95);
    ctx.stroke();
  }

  // 血條
  if (!boss && f.maxHp > 1 && f.hp > 0 && !f.friendly) {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(-r, -r * 1.9, r * 2, 4);
    ctx.fillStyle = '#7fe0a0';
    ctx.fillRect(-r, -r * 1.9, r * 2 * (f.hp / f.maxHp), 4);
  }
  // 定身提示
  if (f.frozenT > 0) {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#ffe066';
    ctx.font = `700 ${Math.round(r * 0.9)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText('✳', 0, -r * 1.7);
  }
  ctx.restore();
}

/* ==================================================================== *
 * 10. 主循環
 * ==================================================================== */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function startLevel(n, resetRun = false) {
  if (resetRun) { state.score = 0; state.unlocked = 1; state.weaponIndex = 0; saveScore(); }
  state.endless = false;
  state.level = n;
  state.phase = 'playing';
  state.levelConfig = LEVELS[n];
  resetRound();
  if (state.levelConfig.boss) {
    const boss = new Fly('boss', { x: W / 2, y: H * 0.33 });
    const hp = state.levelConfig.bossHp || FLY_TYPES.boss.hp;
    boss.hp = hp; boss.maxHp = hp;
    state.boss = boss;
    state.flies.push(boss);
  }
  if (state.levelConfig.defend) {
    const t = defendTarget();
    state.defend = { x: t.x, y: t.y, r: t.r, hp: 100, maxHp: 100 };
  }
  if (state.levelConfig.bees) spawnBee();
  for (let i = 0; i < Math.floor(state.levelConfig.targetCount * 0.7); i++) spawnFly();
  state.gustT = state.levelConfig.gustEvery || 0;
  renderWeaponBar();
  updateWeaponChip();
  updateHud(true);
  GP.gameStart();
}

function startEndless() {
  state.endless = true;
  state.level = 0;
  state.phase = 'playing';
  state.levelConfig = ENDLESS_CFG;
  resetRound();
  state.defend = null;
  state.miniBossT = 60;
  for (let i = 0; i < 6; i++) spawnFly();
  renderWeaponBar();
  updateWeaponChip();
  dom.levelName.textContent = t('endlessTitle');
  updateHud(true);
  GP.gameStart();
}

function resetRound() {
  state.levelScore = 0;
  state.kills = 0;
  state.misses = 0;
  state.survival = 0;
  state.beeHits = 0;
  state.combo = 0;
  state.bestCombo = 0;
  state.comboT = 0;
  state.revived = false;
  state.weaponLockT = 0;
  state.timeLeft = state.levelConfig.time;
  state.cool = 0;
  state.flies = [];
  state.clouds = [];
  state.traps = [];
  state.waves = [];
  state.decoys = [];
  state.rockets = [];
  state.drones = [];
  state.effects = [];
  state.laser = null;
  state.boss = null;
  state.defend = null;
  state.wind = null;
  state.gustT = 0;
  state.spawnTimer = 0;
  state.endlessEntryAt = null;
  state.lastResult = null;
  dom.modal.classList.add('hidden');
  dom.bossWrap.classList.remove('on', 'defend');
  dom.combo.classList.remove('show');
}

function spawnFly(typeHint) {
  const cfg = state.levelConfig;
  if (!cfg) return null;
  let type = typeHint;
  if (!type) {
    type = pickWeighted(cfg.types);
    if (type === 'swarm') {
      const n = randInt(5, 8);
      const cx = rand(W * 0.2, W * 0.8), cy = rand(H * 0.25, H * 0.7);
      const dir = Math.random() < 0.5 ? 1 : -1;
      let last = null;
      for (let i = 0; i < n; i++) {
        const f = new Fly('fruit', { x: cx + rand(-20, 20), y: cy + rand(-20, 20) });
        f.speed *= cfg.speedMul || 1;
        f.angle = dir > 0 ? 0 : Math.PI;            // 整團直線穿過
        last = pushFly(f);
      }
      return last;
    }
  }
  const f = new Fly(type);
  if (cfg.speedMul) { f.speed *= cfg.speedMul; f.baseSpeed = f.speed; }
  if (state.levelConfig.defend && !f.friendly) {
    const t = defendTarget();
    f.targetPos = { x: t.x, y: t.y, r: t.r };
  }
  return pushFly(f);
}

function spawnBee() {
  const f = new Fly('bee', { x: rand(60, W - 60), y: rand(H * 0.25, H * 0.55) });
  f.speed = 95;
  return pushFly(f);
}

function pushFly(fly) {
  fly.state = 'fly';
  state.flies.push(fly);
  return fly;
}

function pickWeighted(types) {
  const table = { house: 0.45, bottle: 0.3, swarm: 0.25, fruit: 0.4, gold: 0.3, minion: 0.5, bee: 0.1 };
  const pool = [];
  for (const t of types) for (let i = 0; i < Math.max(1, Math.round((table[t] || 0.3) * 10)); i++) pool.push(t);
  return pool[Math.floor(Math.random() * pool.length)];
}

function update(dt) {
  if (state.paused) return;
  timeAlive += dt;
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
  updateEffects(dt);
  if (state.phase !== 'playing') return;

  if (state.weaponLockT > 0) state.weaponLockT -= dt;
  if (state.comboT > 0) { state.comboT -= dt; if (state.comboT <= 0) state.combo = 0; }
  if (state.cool > 0) state.cool -= dt;

  const cfg = state.levelConfig;
  if (state.endless) state.survival += dt; else state.timeLeft -= dt;

  // 突風
  if (cfg.gustEvery) {
    if (state.wind) {
      state.wind.t -= dt;
      if (state.wind.t <= 0) state.wind = null;
    } else {
      state.gustT -= dt;
      if (state.gustT <= 0) {
        state.gustT = cfg.gustEvery;
        state.wind = { dir: Math.random() < 0.5 ? -1 : 1, t: 1.3, strength: 260 };
        showToast(t('gust'));
        Sfx.spray();
      }
    }
  }

  // 生成
  state.spawnTimer -= dt;
  const alive = state.flies.filter((f) => f.state !== 'dying').length;
  let every = cfg.spawnEvery;
  let cap = cfg.targetCount;
  if (state.endless) {
    every = Math.max(0.32, 0.9 - state.survival * 0.008);
    cap = Math.min(26, 8 + Math.floor(state.survival * 0.15));
  }
  if (state.spawnTimer <= 0 && alive < cap) {
    state.spawnTimer = every * rand(0.7, 1.25);
    spawnFly();
  }
  if (cfg.bees && state.flies.filter((f) => f.friendly).length < 2 && Math.random() < dt * 0.15) spawnBee();
  if (state.endless) {
    state.miniBossT -= dt;
    if (state.miniBossT <= 0) {
      state.miniBossT = 60;
      const mb = new Fly('miniboss', { x: W / 2, y: H * 0.28 });
      pushFly(mb);
      showToast(t('miniBoss'));
    }
  }

  // 誘餌：先把附近蒼蠅的航向拉向餌，再讓牠們移動
  for (const d of state.decoys) {
    for (const f of state.flies) {
      if (f.dead || f.friendly || f.isBoss) continue;
      if (dist2(d.x, d.y, f.x, f.y) <= d.r * d.r) f.angle = Math.atan2(d.y - f.y, d.x - f.x);
    }
  }

  // 蒼蠅
  for (const f of state.flies) f.update(dt, cfg);
  state.flies = state.flies.filter((f) => !f.dead);

  // V5 特殊武器：誘餌爆炸／音波／火箭／無人機
  for (let i = state.decoys.length - 1; i >= 0; i--) {
    const d = state.decoys[i];
    d.t += dt;
    if (d.t >= d.ttl) {
      for (const f of state.flies) {
        if (f.dead || f.state === 'dying' || f.friendly) continue;
        if (dist2(d.x, d.y, f.x, f.y) <= (d.explodeR + f.r) ** 2) damageFly(f, d.damage, f.x, f.y);
      }
      state.effects.push({ type: 'wave', x: d.x, y: d.y, r: 24, ttl: 0.6, t: 0, color: '#ffd166' });
      burst(d.x, d.y, 12, '#ffd166', 240);
      state.decoys.splice(i, 1);
    }
  }
  for (let i = state.waves.length - 1; i >= 0; i--) {
    const wv = state.waves[i];
    wv.t += dt;
    wv.r = 24 + (wv.maxR - 24) * Math.min(1, wv.t / wv.ttl);
    for (const f of state.flies) {
      if (f.dead || f.state === 'dying' || f.friendly || wv.hit.has(f)) continue;
      if (dist2(wv.x, wv.y, f.x, f.y) <= (wv.r + f.r) ** 2) {
        wv.hit.add(f);
        damageFly(f, wv.damage, f.x, f.y);
      }
    }
    if (wv.t >= wv.ttl) state.waves.splice(i, 1);
  }
  for (let i = state.rockets.length - 1; i >= 0; i--) {
    const r = state.rockets[i];
    r.t += dt;
    const dx = r.tx - r.x, dy = r.ty - r.y, d = Math.hypot(dx, dy) || 1, step = r.speed * dt;
    if (d <= step + 8 || r.t > 2) {
      for (const f of state.flies) {
        if (f.dead || f.state === 'dying' || f.friendly) continue;
        if (dist2(r.tx, r.ty, f.x, f.y) <= (r.r + f.r) ** 2) damageFly(f, r.damage, f.x, f.y);
      }
      state.effects.push({ type: 'wave', x: r.tx, y: r.ty, r: 20, ttl: 0.5, t: 0, color: '#ff9a4a' });
      burst(r.tx, r.ty, 16, '#ff9a4a', 280);
      state.shake = 5;
      state.rockets.splice(i, 1);
    } else {
      r.x += (dx / d) * step;
      r.y += (dy / d) * step;
    }
  }
  for (const dr of state.drones) {
    dr.t += dt;
    dr.fireT -= dt;
    if (dr.fireT <= 0) {
      let best = null, bd = dr.range * dr.range;
      for (const f of state.flies) {
        if (f.dead || f.state === 'dying' || f.friendly) continue;
        const dd = dist2(dr.x, dr.y, f.x, f.y);
        if (dd < bd) { bd = dd; best = f; }
      }
      if (best) {
        zapTo(dr.x, dr.y, best.x, best.y);
        damageFly(best, dr.damage, best.x, best.y);
        dr.fireT = dr.fireEvery;
      } else dr.fireT = 0.2;
    }
  }
  state.drones = state.drones.filter((dr) => dr.t < dr.ttl);

  // 護盾子嗣環繞 Boss
  if (state.boss) {
    state.boss.shieldCount = state.flies.filter((f) => f.shield && !f.dead && f.state !== 'dying').length;
    if (state.boss.phase === 2 && !state.boss.phaseAnnounced) {
      state.boss.phaseAnnounced = true;
      showToast(t('rage'));
      state.shake = 8;
      Sfx.buzz();
    }
  }
  // 環繞
  const shields = state.flies.filter((f) => f.shield && !f.dead && f.state !== 'dying');
  if (state.boss && shields.length) {
    shields.forEach((f, i) => {
      const a = timeAlive * 0.9 + (i / shields.length) * TAU;
      f.x = state.boss.x + Math.cos(a) * (state.boss.r * 1.7);
      f.y = state.boss.y + Math.sin(a) * (state.boss.r * 1.7);
      f.angle = a + Math.PI / 2;
    });
  }

  // 可頌被吃 → 扣衛生度
  if (state.defend && state.boss === null) {
    const eaters = state.flies.filter((f) => f.eating && !f.dead && f.state !== 'dying').length;
    if (eaters > 0) state.defend.hp = Math.max(0, state.defend.hp - (state.levelConfig.drainPerSec || 5) * eaters * dt);
    if (state.defend.hp <= 0) return loseLevel(t('lostCroissant'));
  }

  // 噴霧毒霧（每 0.3 秒結算一次）
  const heldW = currentWeapon();
  if (state.pointer.down && (heldW.mode === 'hold' || heldW.mode === 'holdFan') && state.cool <= 0) {
    state.cool = heldW.cooldown;
    if (heldW.mode === 'holdFan') fireFlame(state.pointer.x, state.pointer.y, heldW);
    else spawnCloud(state.pointer.x, state.pointer.y, heldW);
  }
  for (let i = state.clouds.length - 1; i >= 0; i--) {
    const c = state.clouds[i];
    c.t += dt;
    c.r = lerp(c.r, c.target, clamp(dt * 8, 0, 1));
    c.acc += dt;
    if (c.acc >= c.tick) {
      c.acc -= c.tick;
      for (const f of state.flies) {
        if (f.dead || f.state === 'dying' || f.friendly) continue;
        if (dist2(c.x, c.y, f.x, f.y) <= (c.r + f.r) ** 2) {
          damageFly(f, c.damage, f.x, f.y);
          if (c.freeze && !f.dead) f.frozenT = Math.max(f.frozenT, c.freeze);
        }
      }
    }
    if (c.t >= c.ttl) state.clouds.splice(i, 1);
  }

  // 黏蠅紙
  for (let i = state.traps.length - 1; i >= 0; i--) {
    const t = state.traps[i];
    t.t += dt;
    for (const f of state.flies) {
      if (f.dead || f.state === 'dying' || f.friendly || f.isBoss) continue;
      if (dist2(t.x, t.y, f.x, f.y) <= (t.r * 0.8) ** 2) f.frozenT = Math.max(f.frozenT, t.freeze);
    }
    if (t.t >= t.ttl) state.traps.splice(i, 1);
  }

  if (state.laser) {
    state.laser.t += dt;
    if (state.laser.t >= state.laser.ttl) state.laser = null;
  }

  if (!state.endless) checkGoal();
  else if (state.misses > 20) finishEndless();
  updateHud();
}

function checkGoal() {
  if (state.phase !== 'playing') return;
  const cfg = state.levelConfig;
  if (cfg.goal.maxMisses !== undefined && state.misses > cfg.goal.maxMisses) return loseLevel(t('tooManyMisses'));
  if (cfg.goal.maxBeeHits !== undefined && state.beeHits > cfg.goal.maxBeeHits) return loseLevel(t('tooManyBees'));
  if (cfg.goal.type === 'score' && state.levelScore >= cfg.goal.target) return winLevel();
  if (cfg.goal.type === 'kills' && state.kills >= cfg.goal.target) return winLevel();
  if (cfg.goal.type === 'boss' && !state.boss) return winLevel();
  if (cfg.goal.type === 'defend' && state.timeLeft <= 0 && state.defend.hp > 0) return winLevel();
  if (state.timeLeft <= 0) {
    state.timeLeft = 0;
    return loseLevel(t('timeUp'));
  }
}

function winLevel(playSound = true) {
  if (state.phase !== 'playing' || state.endless) return;
  state.phase = 'won';
  if (playSound) Sfx.win();
  saveProgress(state.level);
  GP.moment('happyMoment', state.levelConfig && state.levelConfig.boss ? 'boss_defeated' : 'level_complete');
  showResult(true);
}

function loseLevel(reason) {
  if (state.phase !== 'playing') return;
  state.phase = 'lost';
  Sfx.lose();
  GP.moment('sadMoment', 'level_failed');
  showResult(false, reason);
}

function finishEndless() {
  if (state.phase !== 'playing') return;
  state.phase = 'lost';
  Sfx.lose();
  GP.moment('sadMoment', 'game_over');
  const entry = { survival: Math.round(state.survival), combo: state.bestCombo, at: Date.now() };
  const board = saveBoard(entry);
  state.endlessEntryAt = entry.at;      // 若玩家看廣告續命，要把這筆排行收回
  showResult(false, t('endlessOver', { n: state.misses }), board);
}

/* ==================================================================== *
 * 11. HUD / 彈窗
 * ==================================================================== */
function updateHud(force = false) {
  const cfg = state.levelConfig;
  if (!cfg) return;
  const timerTxt = state.endless ? state.survival.toFixed(1) : Math.max(0, state.timeLeft).toFixed(1);
  if (force || timerTxt !== state.hud.timer) {
    dom.timer.textContent = timerTxt;
    dom.timer.classList.toggle('low', !state.endless && state.timeLeft <= 10 && state.phase === 'playing');
    state.hud.timer = timerTxt;
  }
  const scoreTxt = String(state.score);
  if (force || scoreTxt !== state.hud.score) {
    dom.score.innerHTML = `${scoreTxt}<small>${t('scoreUnit')}</small>`;
    state.hud.score = scoreTxt;
  }
  let prog = 0, label = '';
  if (cfg.goal.type === 'score') {
    prog = clamp(state.levelScore / cfg.goal.target, 0, 1);
    label = t('goalScore', { a: state.levelScore, b: cfg.goal.target });
  } else if (cfg.goal.type === 'kills') {
    prog = clamp(state.kills / cfg.goal.target, 0, 1);
    label = t('goalKills', { a: state.kills, b: cfg.goal.target }) +
      (cfg.goal.maxMisses !== undefined ? t('goalMisses', { a: state.misses, b: cfg.goal.maxMisses }) : '') +
      (cfg.goal.maxBeeHits !== undefined ? t('goalBees', { a: state.beeHits, b: cfg.goal.maxBeeHits }) : '');
  } else if (cfg.goal.type === 'defend') {
    const hp = state.defend ? Math.ceil(state.defend.hp) : 0;
    prog = state.defend ? 1 - state.defend.hp / state.defend.maxHp : 0;
    label = t('goalHygiene', { hp });
    dom.bossWrap.classList.add('on', 'defend');
    dom.bossName.textContent = t('hygieneName');
    dom.bossBar.style.width = `${hp}%`;
  } else if (cfg.goal.type === 'boss') {
    const b = state.flies.find((f) => f.isBoss && !f.isMiniBoss);
    const hp = b ? b.hp : 0;
    const maxHp = b ? b.maxHp : (state.levelConfig.bossHp || FLY_TYPES.boss.hp);
    prog = 1 - hp / maxHp;
    label = b ? t('bossHp', { hp: Math.ceil(hp), max: maxHp }) + (b.shieldCount > 0 ? t('bossShielded') : '') : t('bossDown');
    dom.bossWrap.classList.add('on');
    dom.bossName.textContent = t('bossName');
    dom.bossBar.style.width = `${clamp((hp / maxHp) * 100, 0, 100)}%`;
  } else {
    prog = clamp(state.survival / 300, 0, 1);
    label = t('survival', { s: Math.floor(state.survival), m: Math.max(0, 20 - state.misses), c: state.bestCombo });
  }
  if (force || label !== state.hud.prog) {
    dom.progressBar.style.width = `${(prog * 100).toFixed(1)}%`;
    dom.progressText.textContent = label;
    state.hud.prog = label;
  }
  const comboTxt = state.combo >= 3 ? t('combo', { n: state.combo }) : '';
  if (force || comboTxt !== state.hud.combo) {
    dom.combo.textContent = comboTxt;
    dom.combo.classList.toggle('show', !!comboTxt);
    state.hud.combo = comboTxt;
  }
  if (force) dom.levelName.textContent = state.endless ? t('endlessTitle') : t('levelN', { n: state.level, name: lvName(state.level) });
}

function updateWeaponChip() {

function renderWeaponBar() {

function showToast(text) {

  dom.toast.classList.add('show');

function showResult(win, reason, board) {
  const cfg = state.levelConfig;
  const last = !state.endless && state.level >= 100;
  const pb = win ? recordRun() : null;
  const stats = win
    ? `<div><span>${t('thisRun')}</span><b>${state.levelScore}</b></div>
       <div><span>${t('totalScore')}</span><b>${state.score}</b></div>
       <div><span>${t('missesLabel')}</span><b>${state.misses}</b></div>
       ${cfg.goal.type === 'defend' ? `<div><span>${t('hygieneLeft')}</span><b>${Math.ceil(state.defend.hp)}</b></div>` : ''}`
    : `<div><span>${state.endless ? t('survived') : t('reasonLabel')}</span><b>${state.endless ? t('secondsShort', { n: Math.round(state.survival) }) : (reason || t('notReached'))}</b></div>
       <div><span>${t('thisRun')}</span><b>${state.levelScore}</b></div>
       <div><span>${t('bestCombo')}</span><b>${state.bestCombo}</b></div>`;

  const boardHtml = (board && board.length)
    ? `<div class="board"><div class="bt">${t('boardTitle')}</div>${board.map((b, i) =>
        `<div><b>${t('boardRow', { i: i + 1, s: b.survival, c: b.combo })}</b></div>`).join('')}</div>`
    : '';

  const nextBtn = (!state.endless && win && !last)
    ? `<button id="btnNext" class="primary">${t('nextLevel')}</button>`
    : (last && win ? `<button id="btnEndless" class="primary">${t('enterEndless')}</button>`
      : (state.endless ? `<button id="btnEndless" class="primary">${t('againEndless')}</button>` : ''));
  const reviveLabel = t(state.endless ? 'reviveEndless' : 'revive');
  const reviveBtn = (!win && !state.revived)
    ? `<button id="btnRevive" class="reward">▶ ${reviveLabel}</button>` : '';

  dom.card.innerHTML = `
    <h2>${win ? (last ? t('winAll') : t('winLevel')) : (state.endless ? t('endlessEnd') : t('loseTitle'))}</h2>
    <p>${state.endless ? t('endlessCard') : t('levelN', { n: state.level, name: lvName(state.level) })}</p>
    <div class="stats">${stats}</div>
    ${pb ? `<div class="pb">🏅 ${t('personalBest')} · <b>${metricText(pb.best, pb.type)}</b> · ${t('bestBy', { name: esc(pb.best.name) })}${pb.isNew ? ' · ' + t('newBest') : ''}</div>` : ''}
    ${LB.enabled && pb ? `<div class="globalResult" id="globalResult">🌍 ${t('globalChecking')}</div>` : ''}
    ${boardHtml}
    <div class="btns">
      ${reviveBtn}
      <button id="btnRetry">${t('retry')}</button>
      ${nextBtn}
      <button id="btnMenu">${t('levels')}</button>
    </div>
    <div class="hint">${lvTip(state.endless ? 'endless' : state.level)}</div>`;
  dom.modal.classList.remove('hidden');
  if (LB.enabled && pb) submitGlobal(pb);

  /* 插頁廣告只放在關卡之間（規則：不得在遊戲中或計時觸發）；
     廣告期間把結算按鈕全部鎖住，避免玩家在 Player 蓋層下誤觸兩次 */
  const lockBtns = (v) => dom.card.querySelectorAll('.btns button').forEach((b) => { b.disabled = v; });
  const afterAd = (fn) => {
    lockBtns(true);
    Sfx.init();
    GP.interstitial().then(() => { lockBtns(false); fn(); });
  };
  document.getElementById('btnRetry').onclick = () => afterAd(() => {
    if (state.endless) startEndless(); else startLevel(state.level);
  });
  const next = document.getElementById('btnNext');
  if (next) next.onclick = () => afterAd(() => startLevel(state.level + 1));
  const endless = document.getElementById('btnEndless');
  if (endless) endless.onclick = () => afterAd(() => startEndless());
  document.getElementById('btnMenu').onclick = () => { Sfx.init(); showStart(); };

  /* 獎勵廣告復活：玩家主動點、可跳過（其他按鈕照常可用），每局一次 */
  const revive = document.getElementById('btnRevive');
  if (revive) revive.onclick = () => {
    if (revive.disabled) return;
    lockBtns(true);
    revive.textContent = t('reviving');
    Sfx.init();
    GP.reward().then((res) => {
      if (res && res.success) { reviveRun(); return; }
      lockBtns(false);
      showToast(t('reviveFailed'));
      revive.textContent = '▶ ' + reviveLabel;
    });
  };
}

async function submitGlobal(pb) {
  const res = await LB.submit(pb.entry);
  const node = document.getElementById('globalResult');
  if (!node) return;
  if (res.status === 'ok') node.textContent = `🌍 ${t('globalRank', { rank: res.rank })}`;
  else if (res.status === 'guest') node.textContent = `🌍 ${t('globalLoginHint')}`;
  else node.textContent = `🌍 ${t('globalOffline')}`;
}

function reviveRun() {
  if (state.revived) return;
  state.revived = true;
  dom.modal.classList.add('hidden');
  state.phase = 'playing';
  state.pointer.down = false;
  state.misses = 0;
  state.beeHits = 0;
  state.weaponLockT = 0;
  if (state.endless) {
    // 續命：這一局還沒結束，把剛才寫入的排行收回，避免一局兩筆
    removeBoardEntry(state.endlessEntryAt);
    state.endlessEntryAt = null;
    showToast(t('revivedEndless'));
  } else {
    state.timeLeft = Math.max(0, state.timeLeft) + 15;
    if (state.defend) state.defend.hp = Math.max(state.defend.hp, 50);
    showToast(t('revived'));
  }
  updateHud(true);
}

function showStart() {
  state.phase = 'menu';
  state.endless = false;
  state.paused = false;
  dom.bossWrap.classList.remove('on', 'defend');
  dom.combo.classList.remove('show');
  const prog = loadProgress();

  let maxCleared = 0;
  for (const k in prog) if (prog[k]) maxCleared = Math.max(maxCleared, +k);
  if (!state.menuChapter) {
    state.menuChapter = clamp(Math.floor(maxCleared / 20) + 1, 1, CHAPTERS.length);
  }
  const chap = clamp(state.menuChapter, 1, CHAPTERS.length);
  state.menuChapter = chap;
  const chapter = CHAPTERS[chap - 1];
  let chapCleared = 0;
  for (let i = 0; i < 20; i++) if (prog[(chap - 1) * 20 + i + 1]) chapCleared++;

  const chapBtns = CHAPTERS.map((c) => {
    const first = (c.id - 1) * 20 + 1;
    const unlocked = levelUnlocked(first);
    let done = 0;
    for (let i = 0; i < 20; i++) if (prog[first + i]) done++;
    return `<button class="chtab${c.id === chap ? ' active' : ''}" data-chap="${c.id}" ${unlocked ? '' : 'disabled'}>
      ${LANG === 'zh' ? c.name : c.name_en}<small>${done}/20</small></button>`;
  }).join('');

  const cells = Array.from({ length: 20 }, (_, i) => {
    const n = (chap - 1) * 20 + i + 1;
    const unlocked = levelUnlocked(n);
    const cleared = !!prog[n];
    return `<button class="lvcell${unlocked ? '' : ' locked'}" data-level="${n}" ${unlocked ? '' : 'disabled'}>
      <b>${cleared ? t('levelCleared') : (unlocked ? '▶' : t('locked'))}</b><span>${n}</span></button>`;
  }).join('');

  const board = loadBoard();
  const boardHtml = board.length
    ? `<div class="board"><div class="bt">${t('boardTitle')}</div>${board.slice(0, 3).map((b, i) =>
        `<div><b>${t('boardRow', { i: i + 1, s: b.survival, c: b.combo })}</b></div>`).join('')}</div>` : '';

  dom.card.innerHTML = `
    <h1>${t('gameTitle')}</h1>
    <div class="sub">V5 · ARCADE</div>
    <p>${t('tagline')}</p>
    <div class="profile">
      <span>${t('player')}: <b id="profileName"></b></span>
      <span class="pfBtns">
        <button id="btnRename" class="mini">✏️ ${t('editName')}</button>
        <button id="btnLang" class="mini">🌐 ${t('languageSwitch')}</button>
      </span>
    </div>
    <div class="chapters">${chapBtns}</div>
    <div class="chapterInfo"><span>${LANG === 'zh' ? chapter.name : chapter.name_en} · ${chapCleared}/20</span>
      <span class="boardBtns">
        <button id="btnBoard" class="mini">🏆 ${t('localBoard')}</button>
        ${LB.enabled ? `<button id="btnGlobal" class="mini global">🌍 ${t('globalBoard')}</button>` : ''}
      </span></div>
    <div class="lvgrid">${cells}</div>
    <button class="lv endless${endlessUnlocked() ? '' : ' locked'}" id="btnEndlessMenu" ${endlessUnlocked() ? '' : 'disabled'}>
      <b>${endlessUnlocked() ? t('endlessCard') : t('endlessLocked')}</b><span>${t('endlessSub')}</span></button>
    ${boardHtml}
    <div class="btns"><button id="btnStart" class="primary">${t('startFrom1')}</button></div>
    <div class="hint">${t('playHint')}</div>`;
  dom.modal.classList.remove('hidden');
  document.getElementById('profileName').textContent = PROFILE.name;
  document.getElementById('btnStart').onclick = () => { Sfx.init(); state.menuChapter = 1; startLevel(1, true); };
  document.getElementById('btnEndlessMenu').onclick = () => { Sfx.init(); startEndless(); };
  document.getElementById('btnRename').onclick = () => renderRename();
  document.getElementById('btnLang').onclick = () => {
    try { localStorage.setItem('fly.swat.lang', LANG === 'zh' ? 'en' : 'zh'); } catch (e) { /* ignore */ }
    location.reload();
  };
  document.getElementById('btnBoard').onclick = () => showBoard(chap);
  const globalBtn = document.getElementById('btnGlobal');
  if (globalBtn) globalBtn.onclick = () => showGlobalBoard(chap);
  dom.card.querySelectorAll('.chtab').forEach((btn) => {
    if (btn.disabled) return;
    btn.onclick = () => { state.menuChapter = +btn.dataset.chap; showStart(); };
  });
  dom.card.querySelectorAll('.lvcell[data-level]').forEach((btn) => {
    if (btn.disabled) return;
    btn.onclick = () => { Sfx.init(); startLevel(+btn.dataset.level, false); };
  });
}

async function loadGlobalLevel(n, revived, type) {
  const box = document.getElementById('globalList');
  if (!box) return;
  let auth = null;
  try {
    auth = await LB.ensureAuth();
    const data = await LB.board(n, revived);
    if (!document.getElementById('globalList')) return;
    const rows = data.rows || [];
    box.innerHTML = rows.length
      ? rows.map((e, i) => `<div class="brow static${e.you ? ' you' : ''}">
          <b>#${i + 1}</b>
          <span>${metricText(e, type)}${e.revived ? ` <i>(${t('revivedTag')})</i>` : ''}</span>
          <i>${esc(e.name)}${e.you ? ` · ${t('globalYou')}` : ''}</i></div>`).join('')
      : `<p class="hint">${t('noRecord')}</p>`;
    const me = document.getElementById('globalMe');
    if (!me) return;
    if (data.me && data.me.rank) {
      me.textContent = `${t('globalYou')} · #${data.me.rank}`;
    } else if (!auth) {
      me.innerHTML = `<button id="btnGlobalLogin" class="mini">${t('globalSignIn')}</button> ${t('globalLoginHint')}`;
      const login = document.getElementById('btnGlobalLogin');
      if (login) login.onclick = async () => {
        await LB.login();
        showGlobalLevel(n, revived);
      };
    } else {
      me.textContent = t('noRecord');
    }
  } catch (e) {
    if (box) box.innerHTML = `<p class="hint">${t('globalError')}</p>`;
    const me = document.getElementById('globalMe');
    if (me) me.innerHTML = auth ? '' : `<button id="btnGlobalLogin" class="mini">${t('globalSignIn')}</button> ${t('globalLoginHint')}`;
    const login = document.getElementById('btnGlobalLogin');
    if (login) login.onclick = async () => {
      await LB.login();
      showGlobalLevel(n, revived);
    };
  }
}

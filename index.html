<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14100c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>打擊蒼蠅大作戰 V5 · Fly Swat Rampage</title>
<!-- GamePix SDK v3：必須先設 config 再載入 SDK（manual lifecycle 才有載入進度與 gameStart 訊號） -->
<script>window.GamePixConfig = { lifecycle: 'manual' };</script>
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<style>
  :root {
    --ink: #f4ede2;
    --panel: rgba(20, 14, 9, .72);
    --line: rgba(255, 206, 140, .28);
    --amber: #ffc46b;
    --blood: #ff5f52;
    --ok: #7fe0a0;
    --blue: #7fd4ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d0a07; color: var(--ink);
    font: 14px/1.5 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; left: 0; right: 0; top: 0; padding: max(8px, env(safe-area-inset-top)) 12px 0;
    pointer-events: none;
  }
  .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #levelName { font-size: 12px; letter-spacing: .06em; color: #d8c6ad; text-shadow: 0 1px 3px #000; }
  #muteBtn {
    pointer-events: auto; width: 34px; height: 34px; padding: 0; border-radius: 50%;
    display: grid; place-items: center; font-size: 15px; line-height: 1;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  }
  #muteBtn:active { transform: scale(.94); }
  #timer {
    font-size: 20px; font-weight: 700; color: var(--amber);
    font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(255, 180, 80, .5);
  }
  #timer.low { color: var(--blood); animation: pulse .6s infinite alternate; }
  @keyframes pulse { from { opacity: 1 } to { opacity: .45 } }

  #progressWrap {
    position: relative; height: 8px; margin: 6px 0 4px;
    background: rgba(255, 255, 255, .12); border-radius: 6px; overflow: hidden;
  }
  #progressBar {
    height: 100%; width: 0%; border-radius: 6px;
    background: linear-gradient(90deg, #ffb347, #ffd98a);
    transition: width .12s linear;
  }
  #progressText {
    position: absolute; right: 4px; top: 9px; font-size: 10px; color: #cbb79c;
  }
  .hud-row.second { margin-top: 8px; }
  #score { font-size: 24px; font-weight: 800; color: #fff2dc; font-variant-numeric: tabular-nums; }
  #score small { font-size: 11px; font-weight: 500; color: #b9a184; margin-left: 4px; }
  #weaponChip {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    font-size: 12px; backdrop-filter: blur(4px);
  }
  #weaponChip .ico { font-size: 15px; }

  #bossWrap { margin-top: 10px; opacity: 0; transition: opacity .2s; }
  #bossWrap.on { opacity: 1; }
  #bossName { font-size: 11px; color: #ffb0a8; letter-spacing: .1em; margin-bottom: 3px; }
  #bossTrack { height: 10px; background: rgba(255, 90, 80, .16); border: 1px solid rgba(255, 120, 100, .45); border-radius: 6px; overflow: hidden; }
  #bossBar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4b3e, #ff8f5c); transition: width .12s linear; }

  /* ---------- weapon bar ---------- */
  #weaponbar {
    position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom));
    display: flex; justify-content: flex-start; align-items: flex-end; flex-wrap: nowrap;
    gap: 4px; padding: 0 8px 4px; pointer-events: auto; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  #weaponbar::-webkit-scrollbar { display: none; }
  #combo {
    position: fixed; left: 50%; top: 26%; transform: translate(-50%, -50%) scale(.9);
    font: 800 20px/1 system-ui, sans-serif; letter-spacing: .06em;
    color: #ffd166; text-shadow: 0 0 16px rgba(255, 180, 60, .6);
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  #combo.show { opacity: 1; }
  #bossWrap.defend #bossName { color: #a9f0b0; }
  #bossWrap.defend #bossBar { background: linear-gradient(90deg, #57c777, #b8f0a0); }
  #bossWrap.defend #bossTrack { border-color: rgba(140, 220, 150, .5); background: rgba(120, 220, 140, .14); }
  .chapters { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin: 12px 0 4px; }
  .chtab {
    padding: 6px 9px; border-radius: 10px; font-size: 10px; letter-spacing: 0;
    display: grid; gap: 1px; color: #e8d6bd;
  }
  .chtab small { font-size: 8px; color: #a9947a; }
  .chtab.active { background: linear-gradient(180deg, #ffb347, #ef8c2e); color: #2a1706; border-color: transparent; font-weight: 700; }
  .chtab.active small { color: #5a3a14; }
  .chapterInfo { font-size: 10px; color: #a9947a; margin: 4px 0 6px; letter-spacing: .08em; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .profile { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 10px 0 2px; font-size: 11px; color: #cbb79c; }
  .profile b { color: #ffe9c9; }
  .pfBtns { display: flex; gap: 6px; }
  #nameInput { width: 130px; padding: 7px 10px; border-radius: 9px; border: 1px solid rgba(255, 200, 130, .45); background: rgba(20, 14, 9, .8); color: #fff3e0; font: inherit; }
  .mini { padding: 5px 9px; border-radius: 999px; font-size: 10px; letter-spacing: .02em; }
  .mini.strong { background: linear-gradient(180deg, #ffb347, #ef8c2e); color: #2a1706; border-color: transparent; font-weight: 700; }
  .boardList { margin: 10px 0 4px; max-height: 52vh; overflow-y: auto; text-align: left; }
  .brow { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: center; width: 100%; padding: 7px 10px; margin: 4px 0; border-radius: 10px; font-size: 11px; text-align: left; }
  .brow.static { border: 1px solid rgba(255, 200, 130, .18); background: rgba(255, 190, 110, .05); }
  .brow b { color: #ffd166; font-size: 10px; }
  .brow span { color: #f0e2cc; }
  .brow i { font-style: normal; color: #a9947a; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
  .pb { margin-top: 8px; padding: 7px 10px; border-radius: 10px; background: rgba(255, 190, 110, .1); color: #ffd166; font-size: 11px; }
  .boardBtns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .mini.global { border-color: rgba(127, 212, 255, .45); color: #bde6ff; }
  .mini.on { background: linear-gradient(180deg, #7fd4ff, #4aa8e0); color: #0b2233; border-color: transparent; font-weight: 700; }
  .gtabs { display: flex; gap: 6px; justify-content: center; margin: 6px 0 2px; }
  .globalResult { margin-top: 6px; font-size: 11px; color: #9fd4ff; }
  .brow.you { border-color: rgba(127, 212, 255, .55); background: rgba(80, 160, 255, .12); }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 6px 0 10px; }
  .lvcell { padding: 7px 0 6px; border-radius: 11px; display: grid; justify-items: center; gap: 0; }
  .lvcell b { font-size: 9px; color: #ffd166; }
  .lvcell span { font-size: 13px; font-weight: 700; }
  .lvcell.locked { opacity: .38; }
  .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 6px; }
  .levels .lv, .lv.endless {
    text-align: left; padding: 9px 10px; border-radius: 12px;
    border: 1px solid rgba(255, 200, 130, .35); background: rgba(255, 190, 110, .08);
    color: #f0e2cc; font-size: 12px; letter-spacing: 0; display: block; width: 100%;
  }
  .levels .lv b { display: block; font-size: 12px; color: #ffe9c9; }
  .levels .lv span, .lv.endless span { display: block; font-size: 10px; color: #a9947a; margin-top: 2px; }
  .lv.endless { grid-column: 1 / -1; margin-top: 8px; border-color: rgba(127, 212, 255, .45); background: rgba(90, 170, 220, .1); }
  .lv.locked { opacity: .45; }
  .board { margin-top: 12px; text-align: left; font-size: 12px; color: #cbb79c; }
  .board .bt { font-size: 11px; letter-spacing: .1em; color: #ffd166; margin-bottom: 4px; }
  .board div { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255, 200, 140, .15); padding: 2px 0; }
  .wbtn {
    pointer-events: auto; flex: 0 0 46px; width: 46px; padding: 5px 1px 4px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    color: #cbb79c; font-size: 7.5px; line-height: 1.2; backdrop-filter: blur(4px);
    transition: transform .12s, border-color .12s, color .12s;
  }
  .wbtn .ico { display: block; font-size: 15px; margin-bottom: 1px; }
  .wbtn.active { border-color: var(--amber); color: #fff4e0; transform: translateY(-3px); box-shadow: 0 0 14px rgba(255, 180, 80, .35); }
  .wbtn.locked { opacity: .42; }
  .wbtn .need { display: block; font-size: 8px; color: #8c7a63; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.86);
    padding: 12px 22px; border-radius: 14px; text-align: center;
    background: rgba(30, 18, 8, .86); border: 1px solid rgba(255, 190, 110, .7);
    color: #ffe6bd; font-size: 15px; font-weight: 700; letter-spacing: .06em;
    box-shadow: 0 0 30px rgba(255, 170, 60, .45); opacity: 0; pointer-events: none;
  }
  #toast.show { animation: pop 1.5s ease-out both; }
  #toast .big { display: block; font-size: 10px; color: var(--amber); letter-spacing: .22em; margin-bottom: 2px; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
    75% { opacity: 1; transform: translate(-50%, -55%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -65%) scale(.96); }
  }

  /* ---------- modal ---------- */
  #modal {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
    background: radial-gradient(circle at 50% 40%, rgba(30, 20, 12, .82), rgba(6, 4, 3, .95));
    padding: 24px; transition: opacity .2s;
  }
  #modal.hidden { opacity: 0; pointer-events: none; }
  .card {
    width: min(420px, 92vw); padding: 22px 20px; text-align: center;
    max-height: calc(100vh - 40px); overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, rgba(38, 26, 16, .96), rgba(18, 12, 8, .96));
    border: 1px solid rgba(255, 190, 110, .35); border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  }
  .card h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .12em; color: var(--amber); }
  .card .sub { font-size: 11px; letter-spacing: .28em; color: #9d8b74; }
  .card h2 { margin: 0 0 10px; font-size: 19px; letter-spacing: .08em; }
  .card p { margin: 6px 0; color: #c6b49c; font-size: 13px; }
  .card .stats { margin: 14px 0 4px; display: grid; gap: 6px; }
  .card .stats div { display: flex; justify-content: space-between; font-size: 13px; color: #d9c9b2; border-bottom: 1px dashed rgba(255, 200, 140, .18); padding-bottom: 4px; }
  .card .stats b { color: #fff3e0; font-variant-numeric: tabular-nums; }
  .btns { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; padding: 11px 20px; border-radius: 999px;
    border: 1px solid rgba(255, 200, 130, .55); background: rgba(255, 190, 110, .12);
    color: #ffe9c9; letter-spacing: .1em; font-size: 13px;
  }
  button.primary { background: linear-gradient(180deg, #ffb347, #ef8c2e); color: #2a1706; font-weight: 700; border-color: transparent; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; }
  button.reward { border-color: rgba(127, 224, 160, .65); color: #bff5d0; background: rgba(127, 224, 160, .12); }
  .hint { margin-top: 12px; font-size: 11px; color: #8d7c66; line-height: 1.7; }

  /* ---------- 載入畫面（GamePix 規定要有） ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; gap: 14px;
    justify-items: center; background: radial-gradient(circle at 50% 40%, #241a10, #0d0a07 70%);
    transition: opacity .35s ease; text-align: center; padding: 24px;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .lt { font-size: 20px; letter-spacing: .18em; color: var(--amber); }
  #loading .lsub { font-size: 11px; letter-spacing: .3em; color: #9d8b74; }
  #loading .lbar { width: 180px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
  #loading .lbar i { display: block; height: 100%; width: 8%; border-radius: 6px; background: linear-gradient(90deg,#ffb347,#ffd98a); transition: width .2s linear; }
  #loading .lp { font-size: 11px; color: #8d7c66; letter-spacing: .12em; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading">
  <div class="lt">FLY SWAT RAMPAGE</div>
  <div class="lsub" id="loadingSub">打擊蒼蠅大作戰</div>
  <div class="lbar"><i></i></div>
  <div class="lp">Loading…</div>
</div>

<div id="hud">
  <div class="hud-row">
    <div id="levelName">第 1 關 · 夏日客廳的西瓜切片</div>
    <div style="display:flex;align-items:center;gap:6px">
      <div id="timer">40.0</div>
      <button id="muteBtn" title="音效開關" aria-label="音效開關">🔊</button>
    </div>
  </div>
  <div id="progressWrap">
    <div id="progressBar"></div>
    <span id="progressText"></span>
  </div>
  <div class="hud-row second">
    <div id="score">0<small>分</small></div>
    <div id="weaponChip"><span class="ico" id="weaponIcon">📰</span><span id="weaponName">捲起來的報紙</span></div>
  </div>
  <div id="bossWrap">
    <div id="bossName">腐敗蠅王 · LORD OF THE SWARM</div>
    <div id="bossTrack"><div id="bossBar"></div></div>
  </div>
</div>

<div id="weaponbar"></div>
<div id="toast"><span class="big">WEAPON UP</span><span id="toastText">武器升級！</span></div>
<div id="combo"></div>

<div id="modal">
  <div class="card" id="card"></div>
</div>

<script>
'use strict';
/* ==================================================================== *
 * 0. 工具
 * ==================================================================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;
const lerp = (a, b, t) => a + (b - a) * t;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dom = {
  levelName: document.getElementById('levelName'),
  timer: document.getElementById('timer'),
  progressBar: document.getElementById('progressBar'),
  progressText: document.getElementById('progressText'),
  score: document.getElementById('score'),
  weaponIcon: document.getElementById('weaponIcon'),
  weaponName: document.getElementById('weaponName'),
  bossWrap: document.getElementById('bossWrap'),
  bossName: document.getElementById('bossName'),
  bossBar: document.getElementById('bossBar'),
  combo: document.getElementById('combo'),
  weaponbar: document.getElementById('weaponbar'),
  toast: document.getElementById('toast'),
  toastText: document.getElementById('toastText'),
  modal: document.getElementById('modal'),
  card: document.getElementById('card'),
};

/* ==================================================================== *
 * 1. 音效（Web Audio 即時合成，不載入外部檔案）
 * ==================================================================== */
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: false,
  log: [],              // 測試/除錯用：記錄最近觸發的音效名稱
  lastKillAt: 0,
  _prefLoaded: false,

  // 讀靜音偏好（不需要 AudioContext，可在啟動時先呼叫）
  loadPref() {
    if (this._prefLoaded) return;
    this._prefLoaded = true;
    try { this.muted = localStorage.getItem('fly.swat.muted') === '1'; } catch (e) { /* 私密模式 */ }
    const btn = document.getElementById('muteBtn');
    if (btn) btn.textContent = this.muted ? '🔇' : '🔊';
  },

  init() {
    this.loadPref();
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      // master → 壓縮器 → 輸出：連續擊殺疊音時不會爆音
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 6;
      comp.attack.value = 0.004; comp.release.value = 0.25;
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.4;
      this.master.connect(comp);
      comp.connect(this.ctx.destination);
      const len = Math.floor(this.ctx.sampleRate * 0.4);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      this.noiseBuf = buf;
      Voice.init(this.ctx);   // 人聲用同一個 AudioContext 解碼
    } catch (err) { this.ctx = null; }
  },

  _log(name) {
    this.log.push({ name, t: Math.round(performance.now()) });
    if (this.log.length > 90) this.log.shift();
  },

  setMuted(v) {
    this.muted = !!v;
    try { localStorage.setItem('fly.swat.muted', this.muted ? '1' : '0'); } catch (e) { /* ignore */ }
    const btn = document.getElementById('muteBtn');
    if (btn) btn.textContent = this.muted ? '\uD83D\uDD07' : '\uD83D\uDD0A';
  },
  toggleMute() { this.setMuted(!this.muted); },

  /* GamePix 規定廣告／暫停時必須停音訊，恢復時只依原本靜音設定還原 */
  suspend() {
    if (this.ctx && this.ctx.state === 'running') {
      try { this.ctx.suspend(); } catch (e) { /* ignore */ }
    }
  },
  wake() {
    if (this.ctx && this.ctx.state === 'suspended' && !this.muted) {
      try { this.ctx.resume(); } catch (e) { /* ignore */ }
    }
  },

  noise(dur, freq, q, gain, type = 'bandpass') {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur);
  },
  tone(freq, dur, type = 'sine', gain = 0.2, slideTo = null) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur);
  },

  /* 揮擊/揮空：只留手感，音量刻意壓低 */
  swing(weapon) {
    if (this.muted) return;
    this._log('swing');
    if (weapon === 'electric') { this.noise(0.09, 2200, 1.1, 0.14); this.tone(1200, 0.05, 'square', 0.045, 700); }
    else if (weapon === 'swatter') this.noise(0.06, 1400, 1.3, 0.12);
    else this.noise(0.08, 1800, 0.8, 0.14);
  },

  /* 命中但沒打死：短促敲擊 */
  hit(weapon) {
    if (this.muted) return;
    this._log('hit');
    this.tone(weapon === 'electric' ? 900 : 300, 0.055, 'triangle', 0.09, 170);
    this.noise(0.045, 2000, 1.2, 0.08);
  },

  /* 擊殺：很輕的一聲「噗」，60ms 內重複觸發只播一次（不會疊成噪音） */
  kill() {
    if (this.muted) return;
    const now = performance.now();
    if (now - this.lastKillAt < 60) return;
    this.lastKillAt = now;
    this._log('kill');
    this.noise(0.055, 2600, 1.8, 0.075, 'highpass');
    this.tone(520, 0.045, 'sine', 0.045, 300);
  },

  /* Boss 倒下：低頻倒塌 + 塵土，勝利動機延後 0.42s 才進（不與關卡通關音重疊） */
  bossDown() {
    this._log('bossDown');
    this.tone(110, 0.9, 'sine', 0.26, 40);
    this.noise(0.75, 420, 0.7, 0.16, 'lowpass');

const Voice = {
  ready: false, buffers: {}, log: [], enabled: true, decodeFailed: false,
  lastKillAt: 0, minGap: 320, killIndex: 0,

  init(ctx) {
    if (this.ready || this.decodeFailed || !ctx) return;
    try {
      for (const [name, line] of Object.entries(VOICE_LINES)) {
        const bin = atob(line.b64);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        ctx.decodeAudioData(buf.buffer,
          (audio) => { this.buffers[name] = audio; },
          () => { this.decodeFailed = true; });
      }
      this.ready = true;
    } catch (e) { this.decodeFailed = true; }
  },

  _log(kind) {
    this.log.push({ name: 'voice:' + kind, t: Math.round(performance.now()) });
    if (this.log.length > 40) this.log.shift();
  },

  play(name, gain) {
    const ctx = Sfx.ctx, buf = this.buffers[name];
    if (!ctx || !buf) return false;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = gain;
    src.connect(g); g.connect(Sfx.master);
    src.start();
    return true;
  },

  /* 每次擊殺都想喊一聲；同一瞬間多殺（電蚊拍/雷射）只喊一次，避免疊成噪音 */
  kill() {
    if (!this.enabled || Sfx.muted) return;
    const now = performance.now();
    if (now - this.lastKillAt < this.minGap) return;
    this.lastKillAt = now;
    this._log('kill');
    const i = this.killIndex++;
    if (LANG === 'zh') {
      if (!this.play(i % 2 === 0 ? 'kill_a' : 'kill_b', 0.75)) this.speak(I18N.zh.voiceKill[0]);
    } else {
      this.speak(I18N.en.voiceKill[i % I18N.en.voiceKill.length]);
    }
  },

  /* 擊倒蠅王：延後 0.32s 進（先讓 bossDown 的低頻炸開）*/
  boss() {
    if (!this.enabled || Sfx.muted) return;
    this._log('boss');
    if (LANG === 'zh') {
      if (!this.play('boss', 0.95)) this.speak(I18N.zh.voiceBoss);
    } else {
      this.speak(I18N.en.voiceBoss);
    }
  },

  /* 內嵌音檔解不開時的退路：瀏覽器 TTS */
  speak(text) {
    if (Sfx.muted) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW'; u.rate = 1.05; u.volume = 0.9;
      window.speechSynthesis.speak(u);
    } catch (e) { /* 不支援就安靜 */ }
  },
};

/* 100 關：5 章 × 20 關，數值隨關卡單調變難（生成而非手寫，避免 100 份重複資料漂移） */
function makeLevel(n) {
  const chapter = CHAPTERS[Math.floor((n - 1) / 20)];
  const stage = ((n - 1) % 20) + 1;
  const isBoss = stage % 10 === 0;
  const isDefend = !isBoss && chapter.id === 3 && stage % 3 !== 0;
  const isKills = !isBoss && !isDefend && (chapter.id === 2 || chapter.id === 4 || stage % 2 === 0);

  const types = chapter.types.filter((tp) => {
    if (tp === 'bottle') return n >= 5;
    if (tp === 'swarm') return n >= 8;
    return true;
  });
  if (n >= 30 && !types.includes('gold')) types.push('gold');

  const cfg = {
    chapter: chapter.id,
    stage,
    theme: chapter.theme,
    name: chapter.name,
    name_en: chapter.name_en,
    time: 40,
    speedMul: Math.min(1.5, 1 + (n - 1) * 0.0035),
    spawnEvery: Math.max(0.30, 0.95 - n * 0.006),
    targetCount: Math.min(28, 8 + Math.floor(n * 0.17)),
    types,
    tip: chapter.tip,
    tip_en: chapter.tip_en,
    watermelon: chapter.id === 1 && stage <= 5,
    bees: chapter.id === 4 && !isBoss,
    gustEvery: chapter.id === 4 && !isBoss ? Math.max(9, 16 - n * 0.05) : 0,
  };

  if (isBoss) {
    cfg.goal = { type: 'boss' };
    cfg.boss = true;
    cfg.bossHp = 80 + Math.floor((n - 10) / 10) * 35;   // 第 10 關 80、第 100 關 395
    cfg.shieldCount = 8 + Math.floor(n / 20);
    cfg.time = 80;
    cfg.targetCount = 6;
    cfg.spawnEvery = Math.max(0.6, 1.4 - n * 0.006);
    cfg.types = ['house'];
    cfg.tip = BOSS_TIP.zh;
    cfg.tip_en = BOSS_TIP.en;
  } else if (isDefend) {
    cfg.goal = { type: 'defend', target: 100 };
    cfg.defend = true;
    cfg.drainPerSec = 4 + Math.floor(n / 20);
    cfg.time = Math.round(45 + Math.min(15, n * 0.12));
    cfg.tip = DEFEND_TIP.zh;
    cfg.tip_en = DEFEND_TIP.en;
  } else if (isKills) {
    cfg.goal = { type: 'kills', target: 14 + Math.floor(n * 0.5), maxMisses: 6 + Math.floor(n / 15) };
    if (cfg.bees) cfg.goal.maxBeeHits = 2;
    cfg.time = Math.round(45 + Math.min(20, n * 0.15));
  } else {
    cfg.goal = { type: 'score', target: 300 + n * 40 };
    cfg.time = Math.round(40 + Math.min(20, n * 0.15));
    if (cfg.bees) cfg.goal.maxBeeHits = 2;
  }
  return cfg;
}

function detectLang() {
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q) return /^zh/i.test(q) ? 'zh' : 'en';
    const stored = localStorage.getItem('fly.swat.lang');
    if (stored === 'zh' || stored === 'en') return stored;
    const list = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || 'en'];
    for (const l of list) if (/^zh/i.test(l)) return 'zh';
  } catch (e) { /* ignore */ }
  return 'en';
}
const LANG = detectLang();

/* t('key', {a: 1}) —— 找不到 key 就回英文，再找不到就回 key 本身 */
function t(key, vars) {
  const pack = I18N[LANG] || I18N.en;
  let s = pack[key];
  if (s === undefined) s = I18N.en[key];
  if (s === undefined) return key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function wName(w) { return I18N[LANG].weaponNames[w.id] || w.name; }
function wShort(w) { return I18N[LANG].weaponShorts[w.id] || w.short; }
function lvName(n) {
  const L = LEVELS[n];
  if (!L) return '';
  const sc = sceneFor(n);
  return LANG === 'zh' ? sc.name : sc.name_en;
}
function lvTip(n) {
  if (n === 'endless') return LANG === 'zh' ? ENDLESS_CFG.tip : ENDLESS_CFG.tip_en;
  const L = LEVELS[n];
  if (!L) return '';
  return LANG === 'zh' ? L.tip : L.tip_en;
}

/* 只有在真正的 Player（iframe 或 gamepix.com）才呼叫廣告；
   公開 demo（GitHub Pages 頂層頁）若呼叫，SDK 會模擬一個假廣告蓋版。
   本機要測廣告時加 ?gpx_ads=1。 */
function adsAllowedNow() {
  try {
    if (window.self !== window.top) return true;
    if (/(^|\.)gamepix\.com$/i.test(location.hostname)) return true;
    return /[?&]gpx_ads=1\b/.test(location.search);
  } catch (e) { return true; }
}
const GP = {
  enabled: false, loadedDone: false, started: false, adBusy: false,
  adsAllowed: adsAllowedNow(),
  calls: [], log: [], pauseReasons: new Set(),

  api() { return (typeof window !== 'undefined' && window.GamePix) || null; },
  log_(name) { this.log.push(name); if (this.log.length > 160) this.log.shift(); },

  init() {
    const api = this.api();
    if (!api) return false;
    try {
      if (api.events && typeof api.events.on === 'function') {
        api.events.on('pause', () => this.pause('sdk'));
        api.events.on('resume', () => this.resume('sdk'));
      }
      this.enabled = true;
    } catch (e) { this.enabled = false; }
    this.loading(5);
    return this.enabled;
  },

  loading(pct) {
    this.log_('loading:' + pct);
    const api = this.api();
    try {
      if (api && api.lifecycle && typeof api.lifecycle.loading === 'function') api.lifecycle.loading(pct);
      else if (api && typeof api.loading === 'function') api.loading(pct);
    } catch (e) { /* ignore */ }
  },

  async loaded() {
    if (this.loadedDone) return;
    this.loadedDone = true;
    this.log_('loaded');
    const api = this.api();
    try {
      if (api && api.lifecycle && typeof api.lifecycle.loaded === 'function') {
        await Promise.race([api.lifecycle.loaded(), new Promise((r) => setTimeout(r, 3000))]);
      } else if (api && typeof api.loaded === 'function') {
        await Promise.race([api.loaded(), new Promise((r) => setTimeout(r, 3000))]);
      }
    } catch (e) { /* ignore */ }
  },

  gameStart() {
    if (this.started) return false;
    this.started = true;
    this.log_('gameStart');
    const api = this.api();
    try {
      if (api && api.lifecycle && typeof api.lifecycle.gameStart === 'function') return api.lifecycle.gameStart();
      if (api && typeof api.gameStart === 'function') return api.gameStart();
    } catch (e) { /* ignore */ }
    return false;
  },

  moment(kind, type) {
    const api = this.api();
    try {
      if (api && typeof api[kind] === 'function') api[kind](type);
    } catch (e) { /* ignore */ }
  },

  /* 暫停必須同時停遊戲時鐘、輸入與音訊；可重入且冪等 */
  pause(reason) {
    this.pauseReasons.add(reason || 'external');
    if (state.paused) return;
    state.paused = true;
    state.pointer.down = false;
    Sfx.suspend();
    this.log_('pause');
  },
  resume(reason) {
    this.pauseReasons.delete(reason || 'external');
    if (!state.paused || this.pauseReasons.size) return;
    state.paused = false;
    Sfx.wake();
    this.log_('resume');
  },

  _withTimeout(p) {
    return Promise.race([p, new Promise((resolve) => setTimeout(() => {
      this.adBusy = false;
      resolve({ success: false, message: 'timeout' });
    }, 9000))]);
  },

  _ad(kind) {
    if (!this.adsAllowed) {
      this.log_('ad:' + kind + ':demo');
      return Promise.resolve({ success: false, message: 'ads-disabled-outside-player' });
    }
    if (this.adBusy) return Promise.resolve({ success: false, message: 'busy' });
    const api = this.api();
    const modern = api && api.ads && typeof api.ads[kind] === 'function';
    const legacyName = kind === 'interstitial' ? 'interstitialAd' : 'rewardAd';
    const legacy = api && typeof api[legacyName] === 'function';
    if (!modern && !legacy) {
      this.log_('ad:' + kind + ':no-sdk');
      return Promise.resolve({ success: false, message: 'no-sdk' });
    }
    this.adBusy = true;
    let p;
    try {
      p = modern ? api.ads[kind]() : api[legacyName]();
    } catch (e) {
      this.adBusy = false;
      return Promise.resolve({ success: false, message: 'error' });
    }
    return Promise.resolve(p).catch(() => ({ success: false })).then((res) => {
      this.adBusy = false;
      const out = (res && typeof res === 'object') ? res : { success: false };
      this.calls.push({ kind, success: !!out.success });
      this.log_('ad:' + kind + ':' + (out.success ? 'ok' : 'no'));
      return out;
    });
  },
  interstitial() { return this._withTimeout(this._ad('interstitial')); },
  reward() { return this._withTimeout(this._ad('reward')); },

  hideLoading() {
    const el = document.getElementById('loading');
    if (el) el.classList.add('hidden');
  },
};

/* ==================================================================== *
 * 4. 蒼蠅
 * ==================================================================== */
class Fly {
  constructor(type, opts = {}) {
    const T = FLY_TYPES[type] || FLY_TYPES.house;
    this.type = type;
    this.T = T;
    this.r = T.r;
    this.hp = T.hp;
    this.maxHp = T.hp;
    this.speed = T.speed * rand(0.85, 1.15);
    this.baseSpeed = this.speed;
    this.points = T.points;
    this.isBoss = !!T.boss;
    this.isMiniBoss = !!T.mini;
    this.friendly = !!T.friendly;
    this.camo = !!T.camo;
    this.x = opts.x !== undefined ? opts.x : rand(40, W - 40);
    this.y = opts.y !== undefined ? opts.y : rand(120, H - 140);
    this.angle = rand(0, TAU);
    this.state = 'fly';
    this.restT = 0;
    this.restSpot = null;
    this.flap = rand(0, TAU);
    this.alpha = 1;
    this.vx = 0;
    this.vy = 0;
    this.hpFlash = 0;
    this.panic = false;
    this.panicT = 0;
    this.legPhase = rand(0, TAU);
    this.spawnT = 0.25;
    this.dead = false;
    this.frozenT = 0;
    this.targetPos = null;
    this.eating = false;
    this.shield = false;
    this.dodgeCd = 0;
    this.skillT = 0;
    this.stunT = 0;
    this.exhaustT = 0;
    this.dive = null;
    this.phase = 1;
    this.shieldCount = 0;
    this.phaseAnnounced = false;
  }

  update(dt, level) {
    this.flap += dt * (this.state === 'rest' ? 6 : 34);
    this.legPhase += dt * 9;
    if (this.hpFlash > 0) this.hpFlash -= dt;
    if (this.spawnT > 0) this.spawnT -= dt;
    if (this.dodgeCd > 0) this.dodgeCd -= dt;

    if (this.state === 'dying') {
      this.vy += 900 * dt;
      this.y += this.vy * dt;
      this.x += this.vx * dt;
      this.alpha -= dt / 0.55;
      if (this.alpha <= 0 || this.y > H + 80) this.dead = true;
      return;
    }

    if (this.isBoss) return this.updateBoss(dt, level);

    // 黏蠅紙定身
    if (this.frozenT > 0) {
      this.frozenT -= dt;
      return;
    }

    // 第 3 關：朝可頌前進 → 停在上面吃
    if (this.targetPos && !this.eating) {
      const dx = this.targetPos.x - this.x;
      const dy = this.targetPos.y - this.y;
      const d = Math.hypot(dx, dy) || 1;
      this.angle = Math.atan2(dy, dx);
      const sp = this.speed * (this.panic ? 1.6 : 1);
      this.vx = (dx / d) * sp;
      this.vy = (dy / d) * sp;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (d < this.targetPos.r * 0.55) {
        this.eating = true;
        this.state = 'rest';
      }
      return;
    }
    if (this.eating) return;   // 停在可頌上，扣血由 update() 統一處理

    if (this.state === 'rest') {
      this.restT -= dt;
      if (this.restT <= 0) { this.state = 'fly'; this.restSpot = null; this.angle = rand(0, TAU); }
      return;
    }

    this.angle += rand(-1, 1) * 2.6 * dt;
    const margin = this.r + 10;
    if (this.x < margin) this.angle = lerp(this.angle, 0, 4 * dt);
    if (this.x > W - margin) this.angle = lerp(this.angle, Math.PI, 4 * dt);
    if (this.y < margin + 60) this.angle = lerp(this.angle, Math.PI / 2, 4 * dt);
    if (this.y > H - margin - 60) this.angle = lerp(this.angle, -Math.PI / 2, 4 * dt);

    if (this.panicT > 0) { this.panicT -= dt; if (this.panicT <= 0) this.panic = false; }
    const speed = this.speed * (this.panic ? 1.75 : 1);
    this.vx = Math.cos(this.angle) * speed;
    this.vy = Math.sin(this.angle) * speed;
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    if (this.x < this.r) { this.x = this.r; this.angle = Math.PI - this.angle; }
    if (this.x > W - this.r) { this.x = W - this.r; this.angle = Math.PI - this.angle; }
    if (this.y < this.r + 52) { this.y = this.r + 52; this.angle = -this.angle; }
    if (this.y > H - this.r - 46) { this.y = H - this.r - 46; this.angle = -this.angle; }

    // 突風（第 4 關）
    if (state.wind) {
      this.x += state.wind.dir * state.wind.strength * dt;
      this.y += Math.sin(timeAlive * 6 + this.flap) * 30 * dt;
      this.x = clamp(this.x, this.r, W - this.r);
    }

    if (!this.friendly && !this.targetPos && !this.isBoss) {
      const restChance = (level && level.watermelon ? 0.9 : 0.45) * dt;
      if (Math.random() < restChance) {
        this.state = 'rest';
        this.restT = rand(1, 2);
        if (level && level.watermelon && Math.random() < 0.55) {
          const spot = watermelonSpot();
          this.x = spot.x + rand(-1, 1) * spot.r * 0.6;
          this.y = spot.y + rand(-1, 1) * spot.r * 0.5;
          this.restSpot = 'watermelon';
        }
      }
    }
  }

  updateBoss(dt, level) {
    this.phase = this.hp > this.maxHp * 0.5 ? 1 : 2;

    // 力竭（俯衝後 2 秒，受到雙倍傷害）
    if (this.exhaustT > 0) {
      this.exhaustT -= dt;
      if (this.exhaustT <= 0) this.state = 'fly';
      return;
    }
    if (this.stunT > 0) {
      this.stunT -= dt;
      return;
    }
    // 俯衝中
    if (this.dive) {
      this.dive.t += dt;
      if (this.dive.t >= this.dive.telegraph) {
        this.x = lerp(this.x, this.dive.tx, Math.min(1, dt * 9));
        this.y = lerp(this.y, this.dive.ty, Math.min(1, dt * 9));
        if (Math.hypot(this.x - this.dive.tx, this.y - this.dive.ty) < 10 || this.dive.t > 2.4) {
          this.dive = null;
          this.exhaustT = 2;
          state.shake = 6;
          state.effects.push({ type: 'wave', x: this.x, y: this.y, r: 24, ttl: 0.7, t: 0, color: '#ffb08a' });
        }
      }
      return;
    }

    this.skillT += dt;
    const speedMul = this.phase === 2 ? 1.5 : 1;

    if (this.phase === 1 && this.skillT >= 10) {
      this.skillT = 0;
      this.castSummon();
      return;
    }
    if (this.phase === 2 && this.skillT >= 7) {
      this.skillT = 0;
      this.startDive();
      return;
    }

    const cx = W / 2, cy = H * 0.33;
    const a = (timeAlive * (this.speed / 220) * speedMul) % TAU;
    const tx = cx + Math.cos(a) * Math.min(W * 0.27, 150);
    const ty = cy + Math.sin(a * 1.6) * Math.min(H * 0.11, 90);
    this.x = lerp(this.x, tx, clamp(dt * 1.6 * speedMul, 0, 1));
    this.y = lerp(this.y, ty, clamp(dt * 1.6 * speedMul, 0, 1));
    this.angle += dt * 0.6;
  }

  castSummon() {
    const n = this.isMiniBoss ? 3 : (state.levelConfig.shieldCount || 10);
    for (let i = 0; i < n; i++) {
      const m = new Fly(this.isMiniBoss ? 'minion' : 'fruit', { x: this.x + rand(-60, 60), y: this.y + rand(-40, 40) });
      m.state = 'fly';
      m.shield = !this.isMiniBoss;
      state.flies.push(m);
    }
    state.effects.push({ type: 'wave', x: this.x, y: this.y, r: 24, ttl: 0.6, t: 0, color: '#ff7a6a' });
    this.stunT = 1.2;
    showToast(t(this.isMiniBoss ? 'summonMini' : 'summonBoss'));
    Sfx.buzz();
  }

  startDive() {
    this.dive = { t: 0, telegraph: 0.55, tx: rand(W * 0.2, W * 0.8), ty: H * 0.82 };
    state.effects.push({ type: 'wave', x: this.x, y: this.y, r: 20, ttl: 0.5, t: 0, color: '#ff5a4a' });
    showToast(t('dive'));
    Sfx.buzz();
  }

  die() {
    this.state = 'dying';
    this.vy = rand(60, 140);
    this.vx = rand(-40, 40);
    burst(this.x, this.y, 9, this.T.color, 220);
    const doublePoints = this.restSpot === 'watermelon';
    const gained = this.points * (doublePoints ? 2 : 1);
    addScore(gained);
    if (!this.friendly) { state.kills++; bumpCombo(); }   // 第 2/4 關的擊殺目標要用
    if (doublePoints) state.effects.push({ type: 'text', x: this.x, y: this.y - 18, ttl: 0.7, t: 0, text: `+${gained}`, color: '#ffe066' });
    Sfx.kill();
    Voice.kill();
  }

  bossDown() {
    this.state = 'dying';
    this.alpha = 1;
    burst(this.x, this.y, 34, '#8a2b2b', 320);
    state.effects.push({ type: 'wave', x: this.x, y: this.y, r: 30, ttl: 0.9, t: 0, color: '#ffb08a' });
    addScore(this.points);
    if (this.isMiniBoss) return;          // 迷你王只是加分，不算通關
    state.boss = null;
    Sfx.bossDown();
    setTimeout(() => Voice.boss(), 320);
    winLevel(false);
  }
}

/* 累積分數是武器解鎖的唯一依據；存起來，重開頁面才不會被打回報紙 */
function loadScore() {
  try {
    const v = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10);
    return Number.isFinite(v) && v > 0 ? v : 0;
  } catch (e) { return 0; }
}
function saveScore() {
  try { localStorage.setItem(SCORE_KEY, String(state.score)); } catch (e) { /* 私密模式 */ }
}
function unlockedFromScore(score) {
  let n = 1;
  while (n < WEAPONS.length && score >= WEAPONS[n].unlock) n++;
  return n;
}

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); } catch (e) { return {}; }
}
function saveProgress(level) {
  try {
    const p = loadProgress();
    p[level] = true;
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
  } catch (e) { /* ignore */ }
}
function levelUnlocked(n) {
  if (n <= 1) return true;
  const p = loadProgress();
  return !!p[n] || !!p[n - 1];
}
function endlessUnlocked() { return !!loadProgress()[100]; }

function loadBoard() {

}
/* ==================================================================== *

/* 上架後要預設開啟時改成 true；?lb=off 仍可強制關閉，?lb=on 可強制開啟。
   現在保持 false＝完全不出現全球榜 UI、不連網。 */
const LB_ENABLED_DEFAULT = false;
const LB_CONFIG = (() => {
  const q = new URLSearchParams(location.search);

  return {

const LB = {
  enabled: LB_CONFIG.enabled,
  auth: null,
  lastResult: null,

  async authNow() {
    if (!this.enabled) return null;
    if (LB_CONFIG.mockToken) {

      this.auth = {

        user: { id, displayName: id.charAt(0).toUpperCase() + id.slice(1), guest: false },
      };
      return this.auth;
    }
    const api = GP.api();
    if (!api || !api.user || typeof api.user.getUser !== 'function') return null;
    try {
      const a = await api.user.getUser();

  async _json(res) {

      throw err;
    }
    return data;
  },

  async submit(entry) {
    if (!this.enabled) return { status: 'off' };
    let auth = this.auth || await this.authNow();
    if (!auth || !auth.token) {
      this.lastResult = { status: 'guest' };
      return this.lastResult;
    }
    const body = {
      level: entry.level,
      value: entry.value,
      timeMs: entry.timeMs,
      misses: entry.misses,
      revived: entry.revived ? 1 : 0,
      name: (auth.user && auth.user.displayName) || PROFILE.name,
    };
    const send = async () => this._json(await fetch(LB_CONFIG.url + '/v1/scores', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + auth.token,
      },
      body: JSON.stringify(body),
    }));
    try {
      const data = await send();
      this.lastResult = Object.assign({ status: 'ok' }, data);
      return this.lastResult;
    } catch (e) {
      if (e.status === 401) {
        this.auth = null;
        auth = await this.authNow();
        if (auth && auth.token) {
          try {
            const data = await send();
            this.lastResult = Object.assign({ status: 'ok' }, data);
            return this.lastResult;
          } catch (e2) { /* fall through */ }
        }
      }
      this.lastResult = { status: 'error', message: String(e.message || e) };
      return this.lastResult;
    }
  },

  async board(level, revived) {
    const headers = {};
    if (this.auth && this.auth.token) headers.Authorization = 'Bearer ' + this.auth.token;
    const res = await fetch(
      `${LB_CONFIG.url}/v1/leaderboard?level=${level}&revived=${revived ? 1 : 0}&limit=50`,
      { headers },
    );
    return this._json(res);
  },

  async login() {
    const api = GP.api();
    if (!api || !api.user || typeof api.user.requestLogin !== 'function') return null;
    try {
      const a = await api.user.requestLogin();
      if (a && a.success && a.token) { this.auth = a; return a; }
    } catch (e) { /* ignore */ }
    return null;
  },
};

const PROFILE_KEY = 'fly.swat.profile';
const BEST_KEY = 'fly.swat.best';

function loadProfile() {
  try {
    const p = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
    return p && typeof p.name === 'string' ? p : null;
  } catch (e) { return null; }
}
function saveProfile(p) {
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) { /* ignore */ }
}
function defaultPlayerName() {
  return (LANG === 'zh' ? '玩家' : 'Player') + '#' + randInt(1000, 9999);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function cleanPlayerName(raw) {
  const s = String(raw == null ? '' : raw)
    .replace(/<[^>]*>/g, '')
    .replace(/[\u0000-\u001f<>]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 12);
  return s || defaultPlayerName();
}
let PROFILE = loadProfile();
if (!PROFILE || !PROFILE.name) {
  PROFILE = { name: defaultPlayerName(), at: Date.now() };
  saveProfile(PROFILE);
}

function loadBests() {
  try {
    const v = JSON.parse(localStorage.getItem(BEST_KEY) || '{}');
    return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  } catch (e) { return {}; }
}
function saveBests(b) {
  try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) { /* ignore */ }
}
/* 每關的排名規則：分數/衛生度比高，擊殺/Boss 比時間（快者優先），平手比失誤 */
function compareBest(a, b, type) {
  if (type === 'score' || type === 'defend') {
    return (b.value - a.value) || (a.timeMs - b.timeMs) || ((a.misses || 0) - (b.misses || 0));
  }
  return (a.timeMs - b.timeMs) || ((a.misses || 0) - (b.misses || 0));
}
function metricText(entry, type) {
  if (!entry) return t('noRecord');
  if (type === 'score') return t('scorePts', { n: entry.value });
  if (type === 'defend') return t('hpLeft', { n: entry.value });
  return t('secondsMs', { s: (entry.value / 1000).toFixed(1) });
}
function recordBest(level, entry) {
  const cfg = LEVELS[level];
  const type = cfg ? cfg.goal.type : 'score';
  const bests = loadBests();
  const list = Array.isArray(bests[level]) ? bests[level].slice() : [];
  const prev = list[0] || null;
  list.push(entry);
  list.sort((a, b) => compareBest(a, b, type));
  const rank = list.findIndex((x) => x === entry) + 1;
  const isNew = !prev || compareBest(entry, prev, type) < 0;
  bests[level] = list.slice(0, 5);
  saveBests(bests);
  return { best: bests[level][0], rank, isNew, type };
}
function recordRun() {
  if (state.endless || !state.levelConfig || state.phase !== 'won') return null;
  const cfg = state.levelConfig;
  const type = cfg.goal.type;
  const timeMs = Math.max(0, Math.round((cfg.time - Math.max(0, state.timeLeft)) * 1000));
  const value = type === 'score' ? state.levelScore
    : type === 'defend' ? Math.ceil((state.defend && state.defend.hp) || 0)
      : timeMs;
  const entry = {
    level: state.level,
    name: PROFILE.name,
    value,
    timeMs,
    misses: state.misses,
    revived: !!state.revived,
    at: Date.now(),
  };
  return Object.assign(recordBest(state.level, entry), { entry });
}

function removeBoardEntry(at) {
  if (!at) return;
  try {
    const board = loadBoard().filter((e) => e.at !== at);
    localStorage.setItem(BOARD_KEY, JSON.stringify(board));
  } catch (e) { /* ignore */ }
}
function saveBoard(entry) {
  const board = loadBoard();
  board.push(entry);
  board.sort((a, b) => b.survival - a.survival || b.combo - a.combo);
  const top = board.slice(0, 5);
  try { localStorage.setItem(BOARD_KEY, JSON.stringify(top)); } catch (e) { /* ignore */ }
  return top;
}

function addScore(n) {
  state.score = Math.max(0, state.score + n);
  if (n > 0) state.levelScore += n;
  checkUnlock();
  saveScore();
}

function checkUnlock() {
  let next = state.unlocked;
  while (next < WEAPONS.length && state.score >= WEAPONS[next].unlock) next++;
  if (next > state.unlocked) {
    const latest = WEAPONS[next - 1];
    state.unlocked = next;
    state.weaponIndex = next - 1;
    showToast(t('weaponUp', { name: wName(latest) }));
    Sfx.upgrade();
    state.effects.push({ type: 'flash', ttl: 0.35, t: 0, color: latest.id === 'laser' ? '#a8e6ff' : '#ffe0a8' });
    renderWeaponBar();
    updateWeaponChip();
  }
}

function currentWeapon() { return WEAPONS[state.weaponIndex]; }

function selectWeapon(i) {
  if (i >= state.unlocked || i === state.weaponIndex) return;
  state.weaponIndex = i;
  state.cool = 0.1;
  renderWeaponBar();
  updateWeaponChip();
}

function bumpCombo() {
  state.combo++;
  state.comboT = 1.5;
  if (state.combo > state.bestCombo) state.bestCombo = state.combo;
}

function addBeeHit(bee) {
  state.beeHits++;
  addScore(-200);
  state.combo = 0;
  state.weaponLockT = 1.0;
  state.effects.push({ type: 'text', x: bee.x, y: bee.y - 20, ttl: 0.9, t: 0, text: t('beeHitText'), color: '#ffd166' });
  state.effects.push({ type: 'wave', x: bee.x, y: bee.y, r: 18, ttl: 0.5, t: 0, color: '#ffd166' });
  Sfx.lose();
  showToast(t('beeHit', { a: state.beeHits, b: (state.levelConfig.goal && state.levelConfig.goal.maxBeeHits) || 2 }));
}

/* ==================================================================== *
 * 6. 攻擊判定
 * ==================================================================== */
function fliesWithin(x, y, radius) {
  const out = [];
  for (const f of state.flies) {
    if (f.dead || f.state === 'dying') continue;
    const rr = radius + f.r;
    if (dist2(x, y, f.x, f.y) <= rr * rr) out.push(f);
  }
  return out;
}

function attack(x, y) {
  if (state.paused) return;
  if (state.phase !== 'playing') return;
  if (state.weaponLockT > 0) return;              // 誤擊蜜蜂的處罰
  const w = currentWeapon();
  if (state.cool > 0) return;
  state.cool = w.cooldown;
  state.pointer.x = x; state.pointer.y = y;

  switch (w.mode) {
    case 'laser': fireLaser(y, w); return;
    case 'hold': spawnCloud(x, y, w); return;
    case 'holdFan': fireFlame(x, y, w); return;
    case 'trap': placeTrap(x, y, w); return;
    case 'fan': fireSalt(x, y, w); return;
    case 'wave': fireWave(x, y, w); return;
    case 'decoy': placeDecoy(x, y, w); return;
    case 'magnet': fireMagnet(x, y, w); return;
    case 'rocket': fireRocket(x, y, w); return;
    case 'drone': deployDrone(x, y, w); return;
    case 'screen': fireScreen(w); return;
    default: tapStrike(x, y, w); return;
  }
}

function tapStrike(x, y, w) {
  Sfx.swing(w.id);
  state.effects.push({ type: 'ring', x, y, r: w.radius, ttl: 0.32, t: 0, color: w.id === 'electric' || w.id === 'twin' ? '#7fd4ff' : '#ffe6b8' });

  const centers = w.twin ? [{ x: x - 55, y }, { x: x + 55, y }]
    : w.triple ? [{ x: x - 70, y }, { x, y }, { x: x + 70, y }]
      : [{ x, y }];
  const hits = [];
  for (const c of centers) {
    const local = fliesWithin(c.x, c.y, w.radius);
    if (w.twin) {
      state.effects.push({ type: 'ring', x: c.x, y: c.y, r: w.radius, ttl: 0.28, t: 0, color: '#7fd4ff' });
      state.effects.push({ type: 'zap', x1: c.x, y1: c.y - 40, x2: c.x, y2: c.y + 40, ttl: 0.2, t: 0 });
    }
    for (const f of local) if (!hits.includes(f)) hits.push(f);
  }

  if (!hits.length) {
    state.misses++;
    state.effects.push({ type: 'puff', x, y, ttl: 0.3, t: 0 });
    return;
  }

  if (w.aoe) {
    for (const f of hits) damageFly(f, w.damage, f.x, f.y);
    if (w.chain) {
      const seen = new Set(hits);
      for (const f of hits) chainLightning(f, seen, w.chain);
    }
    Sfx.hit('electric');
  } else {
    let target = hits[0];
    for (const f of hits) if (dist2(x, y, f.x, f.y) < dist2(x, y, target.x, target.y)) target = f;
    damageFly(target, w.damage, x, y);
  }

  if (w.id === 'swatter' && hits.length) state.effects.push({ type: 'mesh', x, y, ttl: 0.28, t: 0, r: w.radius });
  state.shake = w.id === 'newspaper' ? 4 : 3;
}

function chainLightning(origin, seen, count) {
  let from = origin;
  for (let i = 0; i < count; i++) {
    let best = null, bd = 150 * 150;
    for (const f of state.flies) {
      if (f.dead || f.state === 'dying' || f.friendly || seen.has(f)) continue;
      const d = dist2(from.x, from.y, f.x, f.y);
      if (d < bd) { bd = d; best = f; }
    }
    if (!best) return;
    seen.add(best);
    zapTo(from.x, from.y, best.x, best.y);
    damageFly(best, 1, best.x, best.y);
    from = best;
  }
}

function fireSalt(x, y, w) {
  Sfx.swing('salt');
  const mx = x, my = y;                            // 槍口 = 點擊點
  let ux = W / 2 - mx, uy = H / 2 - my;            // 朝向畫面中心（點在中央時預設往上）
  if (Math.hypot(ux, uy) < 12) { ux = 0; uy = -1; }
  const len = Math.hypot(ux, uy) || 1;
  ux /= len; uy /= len;
  const half = (w.fanDeg * Math.PI) / 360;         // ±30°

  state.effects.push({ type: 'fan', x: mx, y: my, angle: Math.atan2(uy, ux), spread: half, radius: w.radius, ttl: 0.28, t: 0 });

  let any = false;
  for (const f of state.flies) {
    if (f.dead || f.state === 'dying') continue;
    const dx = f.x - mx, dy = f.y - my;
    const d = Math.hypot(dx, dy);
    if (d > w.radius) continue;
    const ang = Math.acos(clamp((dx * ux + dy * uy) / (d || 1), -1, 1));
    if (ang > half) continue;
    any = true;
    const crit = ang < half / 2.5;                 // 扇心
    damageFly(f, crit ? w.centerDamage : w.edgeDamage, f.x, f.y, { crit });
    if (crit) state.effects.push({ type: 'hit', x: f.x, y: f.y, ttl: 0.3, t: 0, color: '#ffd166', label: t('crit') });
  }
  if (!any) state.misses++;
  state.shake = 5;
}

function placeTrap(x, y, w) {
  Sfx.swing('trap');
  state.traps.push({ x, y, r: w.radius, ttl: w.trapTTL, t: 0, freeze: w.freeze });
  state.effects.push({ type: 'ring', x, y, r: w.radius, ttl: 0.4, t: 0, color: '#e8e0a0' });
  Sfx.spray();
}

function spawnCloud(x, y, w) {
  state.clouds.push({ x, y, r: 10, target: w.radius, ttl: 1.5, t: 0, acc: 0, tick: w.tick, damage: w.tickDamage, freeze: w.freeze || 0 });
  Sfx.spray();
}

function fireLaser(y, w) {
  const band = w.band;
  const targets = state.flies.filter((f) => !f.dead && f.state !== 'dying' && Math.abs(f.y - y) < band + f.r);
  for (const f of targets) {
    if (f.friendly) continue;                      // 雷射不打蜜蜂
    if (f.isBoss) damageFly(f, w.bossDamage, f.x, y, { pierce: w.pierce, crit: f.exhaustT > 0 });
    else damageFly(f, w.damage, f.x, y, { pierce: w.pierce });
  }
  state.laser = { y, t: 0, ttl: 0.4, band };
  state.shake = 7;
  Sfx.laser();
}

/* ---- V5 新武器 ---- */
function fireWave(x, y, w) {
  Sfx.swing('sonic');
  state.waves.push({ x, y, r: 24, maxR: w.radius, damage: w.damage, t: 0, ttl: 0.45, hit: new Set() });
  state.effects.push({ type: 'ring', x, y, r: w.radius, ttl: 0.45, t: 0, color: '#9fe8ff' });
  state.shake = 3;
}

function placeDecoy(x, y, w) {
  Sfx.spray();
  state.decoys.push({ x, y, r: 230, ttl: 2.2, t: 0, explodeR: w.radius, damage: w.damage });
  state.effects.push({ type: 'ring', x, y, r: 230, ttl: 0.5, t: 0, color: '#ffd166' });
}

function fireMagnet(x, y, w) {
  Sfx.swing('magnet');
  for (const f of fliesWithin(x, y, w.radius)) {
    if (f.isBoss || f.friendly) continue;
    f.x += (x - f.x) * 0.55;
    f.y += (y - f.y) * 0.55;
    f.frozenT = Math.max(f.frozenT, 0.35);
    zapTo(f.x, f.y, x, y);
    damageFly(f, w.damage, f.x, f.y);
  }
  state.effects.push({ type: 'ring', x, y, r: w.radius, ttl: 0.35, t: 0, color: '#b28bff' });
  state.shake = 4;
}

function fireRocket(x, y, w) {
  Sfx.swing('rocket');
  state.rockets.push({ x: W / 2, y: H - 90, tx: x, ty: y, t: 0, speed: 1300, r: w.radius, damage: w.damage });
}

function deployDrone(x, y, w) {
  Sfx.upgrade();
  state.drones.push({
    x, y, ttl: w.droneTTL || 6, t: 0, fireT: 0, range: w.radius,
    damage: w.damage, fireEvery: w.fireEvery || 0.35,
  });
  state.effects.push({ type: 'wave', x, y, r: 16, ttl: 0.5, t: 0, color: '#7fd4ff' });
}

function fireScreen(w) {
  Sfx.laser();
  for (const f of [...state.flies]) {
    if (f.dead || f.state === 'dying' || f.friendly) continue;
    if (f.isBoss) damageFly(f, w.bossDamage, f.x, f.y, { pierce: true });
    else damageFly(f, 99, f.x, f.y, { pierce: true });
  }
  state.effects.push({ type: 'flash', ttl: 0.4, t: 0, color: '#ffd9a0' });
  state.shake = 9;
}

function fireFlame(x, y, w) {
  let ux = W / 2 - x, uy = H / 2 - y;
  if (Math.hypot(ux, uy) < 12) { ux = 0; uy = -1; }
  const len = Math.hypot(ux, uy) || 1;
  ux /= len; uy /= len;
  const half = (w.fanDeg * Math.PI) / 360;
  for (const f of state.flies) {
    if (f.dead || f.state === 'dying' || f.friendly) continue;
    const dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy);
    if (d > w.radius) continue;
    if (Math.acos(clamp((dx * ux + dy * uy) / (d || 1), -1, 1)) > half) continue;
    damageFly(f, w.tickDamage, f.x, f.y);
  }
  state.effects.push({
    type: 'fan', x, y, angle: Math.atan2(uy, ux), spread: half,
    radius: w.radius, ttl: 0.18, t: 0, color: '#ff9a4a',
  });
  Sfx.spray();
  state.shake = 2;
}

function zapTo(x1, y1, x2, y2) {
  state.effects.push({ type: 'zap', x1, y1, x2, y2, ttl: 0.22, t: 0 });
}

/* 統一的傷害入口：蜜蜂／護盾／易傷／Boss 階段都集中在這裡 */
function damageFly(f, dmg, hx, hy, opts = {}) {
  if (!f || f.dead || f.state === 'dying') return;
  if (f.friendly) { addBeeHit(f); return; }

  if (f.isBoss) {
    if (f.shieldCount > 0 && !opts.pierce) {
      state.effects.push({ type: 'hit', x: hx, y: hy, ttl: 0.25, t: 0, color: '#7fd4ff', label: t('shield') });
      Sfx.hit('shield');
      return;
    }
    if (f.dodgeCd <= 0 && f.exhaustT <= 0 && f.phase === 1 && Math.random() < 0.2) {
      f.dodgeCd = 1.1;
      f.x = rand(W * 0.2, W * 0.8);
      f.y = rand(H * 0.18, H * 0.5);
      state.effects.push({ type: 'dodge', x: hx, y: hy, ttl: 0.45, t: 0 });
      return;
    }
    let d = dmg;
    if (f.exhaustT > 0) d *= 2;
    if (opts.crit) d *= 2;
    f.hp -= d;
    f.hpFlash = 0.16;
    state.effects.push({ type: 'hit', x: hx, y: hy, ttl: 0.25, t: 0, color: d >= 4 ? '#ffd166' : '#ff9c8a', label: d >= 4 ? 'x' + Math.round(d) : '' });
    Sfx.hit('heavy');
    if (f.hp <= 0) { f.hp = 0; f.bossDown(); }
    return;
  }

  let d = dmg;
  if (f.frozenT > 0) d *= 1.5;                     // 黏蠅紙易傷
  if (opts.crit) d *= 2;
  f.hp -= d;
  f.hpFlash = 0.14;
  if (f.hp <= 0) { f.die(); return; }
  Sfx.hit(f.T.panic ? 'bottle' : 'fly');
  if (f.T.panic) { f.panic = true; f.panicT = 2.5; f.angle = rand(0, TAU); }
}

/* ==================================================================== *
 * 7. 粒子 / 特效
 * ==================================================================== */
function burst(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const s = rand(speed * 0.25, speed);
    state.effects.push({
      type: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
      r: rand(2, 4.5), color, ttl: rand(0.3, 0.6), t: 0,
    });
  }
}

function updateEffects(dt) {
  for (let i = state.effects.length - 1; i >= 0; i--) {
    const e = state.effects[i];
    e.t += dt;
    if (e.type === 'dot') {
      e.vy += 520 * dt;
      e.x += e.vx * dt; e.y += e.vy * dt;
    } else if (e.type === 'ring' || e.type === 'wave') {
      e.r += 240 * dt;
    }
    if (e.t >= e.ttl) state.effects.splice(i, 1);
  }
}

function drawEffects() {
  for (const e of state.effects) {
    const k = 1 - e.t / e.ttl;
    if (e.type === 'ring') {
      ctx.globalAlpha = k * 0.85;
      ctx.strokeStyle = e.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.stroke();
    } else if (e.type === 'wave') {
      ctx.globalAlpha = k * 0.7;
      ctx.strokeStyle = e.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.stroke();
    } else if (e.type === 'dot') {
      ctx.globalAlpha = clamp(k * 1.4, 0, 1);
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * k, 0, TAU); ctx.fill();
    } else if (e.type === 'puff') {
      ctx.globalAlpha = k * 0.4;
      ctx.fillStyle = '#cbb79c';
      ctx.beginPath(); ctx.arc(e.x, e.y, 14 * (1 - k) + 4, 0, TAU); ctx.fill();
    } else if (e.type === 'mesh') {
      ctx.globalAlpha = k * 0.7;
      ctx.strokeStyle = '#e9e2d2'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.6 + 0.4 * (1 - k)), 0, TAU); ctx.stroke();
      for (let i = 1; i <= 2; i++) {
        ctx.beginPath(); ctx.arc(e.x, e.y, (e.r * i) / 3, 0, TAU); ctx.stroke();
      }
    } else if (e.type === 'fan') {
      ctx.globalAlpha = k * 0.5;
      if (e.color) {
        ctx.fillStyle = e.color;
      } else {
        const g = ctx.createRadialGradient(e.x, e.y, 4, e.x, e.y, e.radius);
        g.addColorStop(0, 'rgba(255,255,240,.85)');
        g.addColorStop(1, 'rgba(255,240,200,0)');
        ctx.fillStyle = g;
      }
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, e.radius, e.angle - e.spread, e.angle + e.spread);
      ctx.closePath(); ctx.fill();
    } else if (e.type === 'zap') {
      ctx.globalAlpha = k;
      ctx.strokeStyle = '#9fe6ff'; ctx.lineWidth = 2.5;
      ctx.shadowColor = '#5ad4ff'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(e.x1, e.y1);
      for (let i = 1; i <= 4; i++) {
        const t = i / 4;
        ctx.lineTo(lerp(e.x1, e.x2, t) + rand(-7, 7), lerp(e.y1, e.y2, t) + rand(-7, 7));
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (e.type === 'text') {
      ctx.globalAlpha = clamp(k * 1.6, 0, 1);
      ctx.fillStyle = e.color; ctx.font = '700 18px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(e.text, e.x, e.y - (1 - k) * 26);
    } else if (e.type === 'hit') {
      ctx.globalAlpha = k;
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, 10 * (1 - k) + 4, 0, TAU); ctx.fill();
      if (e.label) {
        ctx.globalAlpha = k; ctx.fillStyle = '#ffe066';
        ctx.font = '700 16px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(e.label, e.x, e.y - 18 - (1 - k) * 14);
      }
    } else if (e.type === 'dodge') {
      ctx.globalAlpha = k * 0.9;
      ctx.strokeStyle = '#ff8f7a'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.arc(e.x - i * 12, e.y, 18 + i * 10, 0.2, 2.6); ctx.stroke();
      }
    } else if (e.type === 'flash') {
      ctx.globalAlpha = k * 0.35;
      ctx.fillStyle = e.color;
      ctx.fillRect(0, 0, W, H);
    }
  }
  ctx.globalAlpha = 1;
}

 * 8. 場景繪製（100 關＝5 章 × 20 個獨立場景）
 * --------------------------------------------------------------------
 * 每關都有獨立的場景名稱、主視覺、配色、時間與雜物組合；背景只畫一次，
 * 快取在離屏 canvas，之後每帧 drawImage，避免 100 種細節拖慢主循環。
 * ==================================================================== */
function watermelonSpot() {
  return { x: W / 2, y: H * 0.6, r: Math.min(W, H) * 0.2 };
}

function defendTarget() {
  return { x: W / 2, y: H * 0.62, r: Math.min(W, H) * 0.15 };
}

let bgCache = { key: '', canvas: null, spec: null };

function sceneHsl(h, s, l) {
  return `hsl(${Math.round((h + 360) % 360)}, ${Math.round(s)}%, ${Math.round(l)}%)`;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffleInPlace(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function makeScenePalette(ci, si, time) {
  const baseHue = [26, 18, 34, 104, 205][ci];
  const hue = baseHue + ((si * 7) % 26) - 13;
  const night = time.id === 'night' || time.id === 'neon';
  const light = night ? 17 : time.id === 'dusk' ? 22 : 26;
  return {
    wall: sceneHsl(hue, 25, light),
    wall2: sceneHsl(hue, 30, Math.max(9, light - 9)),
    floor: sceneHsl(ci === 2 ? 34 : ci === 3 ? 104 : ci === 4 ? 210 : hue, 22, Math.max(10, light - 12)),
    accent: sceneHsl(hue + 42, 58, night ? 52 : 62),
    accent2: sceneHsl(hue + 190, 48, night ? 48 : 56),
    line: `rgba(255,255,255,${night ? 0.05 : 0.085})`,
    glass: 'rgba(220,240,255,.10)',
    sky1: time.sky1,
    sky2: time.sky2,
    tint: time.tint,
    night,
  };
}

function sceneSpec(n) {
  const idx = Math.max(1, Math.min(100, Math.round(Number(n) || 1)));
  const ci = Math.floor((idx - 1) / 20);
  const si = (idx - 1) % 20;
  const ch = SCENE_CHAPTERS[ci];
  const sc = ch.scenes[si];
  const rng = mulberry32((idx * 2654435761) >>> 0);
  const pool = ch.pool.filter((k) => k !== sc.f);
  shuffleInPlace(pool, rng);
  const time = SCENE_TIMES[(si * 2 + ci * 3) % SCENE_TIMES.length];
  return {
    n: idx, chapter: ci + 1, stage: si + 1,
    key: `${ci + 1}-${si + 1}-${sc.f}`,
    name: sc.n, name_en: sc.e, focal: sc.f,
    props: sc.f === 'watermelon' ? ['plant', 'lamp'] : pool.slice(0, 4), time,
    pal: makeScenePalette(ci, si, time),
  };
}

function sceneFor(n) {
  const L = LEVELS[n];
  if (!L) return sceneSpec(n);
  if (!L.__scene) L.__scene = sceneSpec(n);
  return L.__scene;
}

/* 測試／驗證用：每個場景的像素指紋（96×160） */
function sceneHash(n) {
  const spec = sceneSpec(n);
  const cv = document.createElement('canvas');
  cv.width = 96; cv.height = 160;
  const g = cv.getContext('2d');
  drawStaticScene(g, spec, 96, 160);
  const d = g.getImageData(0, 0, 96, 160).data;
  let h = 2166136261;
  for (let i = 0; i < d.length; i += 16) {
    h ^= d[i] + d[i + 1] * 3 + d[i + 2] * 7;
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h.toString(16);
}

/* ---------- 基本繪圖 ---------- */
function srr(g, x, y, w, h, r, fill) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r);
  else {
    const q = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    g.moveTo(x + q, y);
    g.arcTo(x + w, y, x + w, y + h, q);
    g.arcTo(x + w, y + h, x, y + h, q);
    g.arcTo(x, y + h, x, y, q);
    g.arcTo(x, y, x + w, y, q);
    g.closePath();
  }
  g.fillStyle = fill;
  g.fill();
}

function sell(g, x, y, rx, ry, rot, fill) {
  g.beginPath();
  g.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), rot || 0, 0, TAU);
  g.fillStyle = fill;
  g.fill();
}

function sline(g, x1, y1, x2, y2, color, lw) {
  g.strokeStyle = color;
  g.lineWidth = lw || 1;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
}

function sglow(g, x, y, r, color) {
  const gr = g.createRadialGradient(x, y, 0, x, y, Math.max(2, r));
  gr.addColorStop(0, color);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}

function drawWindowView(g, x, y, w, h, spec) {
  const p = spec.pal;
  const sky = g.createLinearGradient(0, y, 0, y + h);
  sky.addColorStop(0, p.sky1); sky.addColorStop(1, p.sky2);
  g.fillStyle = sky; g.fillRect(x, y, w, h);
  if (spec.time.id === 'night' || spec.time.id === 'neon') {
    g.fillStyle = 'rgba(255,255,230,.9)';
    for (let i = 0; i < 9; i++) {
      const sx = x + ((i * 37 + spec.n * 11) % 97) / 97 * w;
      const sy = y + ((i * 53 + spec.n * 7) % 89) / 89 * h * 0.72;
      g.beginPath(); g.arc(sx, sy, 1.2 + (i % 2), 0, TAU); g.fill();
    }
    sell(g, x + w * 0.72, y + h * 0.24, w * 0.1, h * 0.1, 0, '#f3f0d8');
  } else {
    sell(g, x + w * 0.72, y + h * 0.24, w * 0.11, h * 0.11, 0, 'rgba(255,240,180,.9)');
    sglow(g, x + w * 0.72, y + h * 0.24, w * 0.42, 'rgba(255,240,170,.28)');
  }
  g.fillStyle = 'rgba(20,30,25,.32)';
  for (let i = 0; i < 5; i++) {
    const bx = x + (i / 4) * w;
    const bh = h * (0.18 + (i % 3) * 0.06);
    g.fillRect(bx, y + h - bh, w * 0.2, bh);
  }
  g.strokeStyle = 'rgba(40,30,22,.9)'; g.lineWidth = Math.max(2, w * 0.025);
  g.strokeRect(x, y, w, h);
  sline(g, x + w / 2, y, x + w / 2, y + h, 'rgba(40,30,22,.9)', Math.max(1, w * 0.018));
  sline(g, x, y + h * 0.55, x + w, y + h * 0.55, 'rgba(40,30,22,.9)', Math.max(1, w * 0.018));
  g.fillStyle = 'rgba(255,255,255,.11)';
  g.beginPath(); g.moveTo(x + w * .12, y + h); g.lineTo(x + w * .38, y); g.lineTo(x + w * .5, y); g.lineTo(x + w * .2, y + h); g.fill();
}

function drawCurtain(g, x, y, w, h, p) {
  g.fillStyle = p.accent;
  g.globalAlpha = 0.55;
  g.beginPath();
  g.moveTo(x, y); g.quadraticCurveTo(x + w * .5, y + h * .2, x + w * .18, y + h);
  g.lineTo(x, y + h); g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(x + w, y); g.quadraticCurveTo(x + w * .5, y + h * .2, x + w * .82, y + h);
  g.lineTo(x + w, y + h); g.closePath(); g.fill();

}

function drawCat(g, u, p, tail) {

  g.beginPath(); g.moveTo(u * .17, -u * .2); g.lineTo(u * .2, -u * .28); g.lineTo(u * .23, -u * .2); g.fill();
  g.fillStyle = '#ffe066';
  g.beginPath(); g.arc(u * .1, -u * .15, u * .012, 0, TAU); g.fill();
  g.beginPath(); g.arc(u * .16, -u * .15, u * .012, 0, TAU); g.fill();
  g.strokeStyle = c; g.lineWidth = u * .025;
  g.beginPath(); g.moveTo(-u * .14, -u * .02);
  g.quadraticCurveTo(-u * .34, -u * .1, -u * .28, -u * .3); g.stroke();
}

function baseMarket(g, spec, w, h) {
  const p = spec.pal;
  const wall = g.createLinearGradient(0, 0, 0, h);
  wall.addColorStop(0, p.wall2); wall.addColorStop(0.5, p.wall); wall.addColorStop(1, '#15110d');
  g.fillStyle = wall; g.fillRect(0, 0, w, h);
  // 帆布屋頂
  const stripes = 9;
  for (let i = 0; i < stripes; i++) {
    g.fillStyle = i % 2 ? 'rgba(0,0,0,.22)' : 'rgba(255,255,255,.05)';
    g.beginPath();
    g.moveTo((i / stripes) * w, 0);
    g.lineTo(((i + 1) / stripes) * w, 0);
    g.lineTo(((i + 1) / stripes) * w + w * .03, h * .14);
    g.lineTo((i / stripes) * w + w * .03, h * .14);
    g.closePath(); g.fill();
  }
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, h * .14, w, h * .025);
  // 後方攤位
  for (let i = 0; i < 4; i++) {
    const x = w * (.13 + i * .24), y = h * .34;
    g.fillStyle = 'rgba(30,20,15,.62)';
    g.fillRect(x - w * .08, y, w * .16, h * .24);
    g.fillStyle = i % 2 ? p.accent : p.accent2;
    g.globalAlpha = .42;
    g.fillRect(x - w * .09, y - h * .025, w * .18, h * .03);
    g.globalAlpha = 1;
    // 後方貨架
    g.fillStyle = 'rgba(255,255,255,.05)';
    g.fillRect(x - w * .07, y + h * .04, w * .14, 2);
    g.fillRect(x - w * .07, y + h * .1, w * .14, 2);
    for (let j = 0; j < 3; j++) {
      g.fillStyle = ['#e85d4a', '#f2a33c', '#8fc24a'][(i + j) % 3];
      g.beginPath(); g.arc(x - w * .05 + j * w * .05, y + h * .035, w * .012, 0, TAU); g.fill();
    }
  }
  // 吊燈串
  g.strokeStyle = 'rgba(60,45,30,.8)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(0, h * .2); g.quadraticCurveTo(w * .5, h * .24, w, h * .2); g.stroke();
  for (let i = 0; i < 5; i++) {
    const bx = w * (.1 + i * .2), by = h * (.2 + .035 * Math.sin(i * 1.4));
    sline(g, bx, h * .2, bx, by, 'rgba(60,45,30,.8)', 1);
    drawBulb(g, bx, by, 5, 'rgba(255,200,110,.35)');
  }
  // 地面
  const floor = g.createLinearGradient(0, h * .6, 0, h);
  floor.addColorStop(0, '#2a2925'); floor.addColorStop(1, '#0d0e0e');
  g.fillStyle = floor; g.fillRect(0, h * .6, w, h * .4);
  // 濕地反光
  for (let i = 0; i < 12; i++) {
    const x = (i * 71) % w, y = h * (.64 + ((i * 37) % 30) / 100);
    g.fillStyle = `rgba(255,220,170,${.025 + (i % 3) * .015})`;
    g.fillRect(x, y, 2 + (i % 4), h * .1);
  }
  for (let i = 0; i < 4; i++) {
    sell(g, w * (.2 + i * .2), h * .78, w * .07, h * .012, 0, 'rgba(180,220,240,.08)');
  }
  // 兩側木箱
  for (let side = 0; side < 2; side++) {
    const x = side ? w * .92 : w * .08;
    for (let i = 0; i < 2; i++) {
      srr(g, x - w * .045, h * (.59 + i * .06), w * .09, h * .05, 2, i % 2 ? '#8a6a42' : '#6b4a30');
    }
  }
  g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, 0, w, h * .04);
}

  g.fillStyle = 'rgba(220,240,255,.10)';

  g.strokeStyle = 'rgba(255,255,255,.34)'; g.lineWidth = 2;

  g.fillStyle = '#6b4a30'; g.fillRect(0, h * .82, w, h * .05);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fly Swat Rampage — icon</title>
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #0d0906; }
  .wrap {
    position: relative; width: 512px; height: 512px;
    background: radial-gradient(circle at 50% 42%, #56360f 0%, #2a1a09 44%, #0b0805 78%);
  }
  .ring {
    position: absolute; left: 50%; top: 50%; width: 352px; height: 352px;
    transform: translate(-50%, -50%) rotate(-14deg);
    border: 14px solid rgba(255, 196, 107, .9); border-radius: 50%;
    box-shadow: inset 0 0 70px rgba(255, 150, 40, .35), 0 0 46px rgba(255, 150, 50, .35);
  }
  .ring::after {
    content: ''; position: absolute; inset: 30px; border-radius: 50%;
    border: 3px dashed rgba(255, 220, 160, .45);
  }
  .fly {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-54%, -56%) rotate(-8deg);
    font-size: 296px; line-height: 1;
    filter: drop-shadow(0 20px 26px rgba(0, 0, 0, .65));
  }
  .hit {
    position: absolute; left: 50%; top: 46%; width: 340px; height: 340px;
    transform: translate(-50%, -50%);
    background:
      conic-gradient(from 8deg,
        rgba(255, 238, 190, .0) 0 4%, rgba(255, 238, 190, .85) 4% 6%,
        rgba(255, 238, 190, .0) 6% 12%, rgba(255, 238, 190, .75) 12% 14%,
        rgba(255, 238, 190, .0) 14% 21%, rgba(255, 238, 190, .8) 21% 23%,
        rgba(255, 238, 190, .0) 23% 31%, rgba(255, 238, 190, .7) 31% 33%,
        rgba(255, 238, 190, .0) 33% 42%, rgba(255, 238, 190, .8) 42% 44%,
        rgba(255, 238, 190, .0) 44% 53%, rgba(255, 238, 190, .75) 53% 55%,
        rgba(255, 238, 190, .0) 55% 64%, rgba(255, 238, 190, .8) 64% 66%,
        rgba(255, 238, 190, .0) 66% 74%, rgba(255, 238, 190, .7) 74% 76%,
        rgba(255, 238, 190, .0) 76% 85%, rgba(255, 238, 190, .8) 85% 87%,
        rgba(255, 238, 190, .0) 87% 94%, rgba(255, 238, 190, .75) 94% 96%,
        rgba(255, 238, 190, .0) 96% 100%);
    -webkit-mask: radial-gradient(circle, transparent 40%, #000 44%, #000 66%, transparent 72%);
            mask: radial-gradient(circle, transparent 40%, #000 44%, #000 66%, transparent 72%);
    opacity: .75;
  }
  .swatter {
    position: absolute; right: -6px; bottom: -10px; width: 200px; height: 240px;
    transform: rotate(-20deg); filter: drop-shadow(0 16px 22px rgba(0, 0, 0, .7));
  }
  .mesh {
    position: absolute; left: 4px; top: 0; width: 168px; height: 196px;
    border: 12px solid #d9974a; border-radius: 46% 46% 40% 40%;
    background:
      repeating-linear-gradient(90deg, rgba(255, 226, 178, .45) 0 3px, transparent 3px 17px),
      repeating-linear-gradient(0deg, rgba(255, 226, 178, .45) 0 3px, transparent 3px 17px),
      rgba(30, 19, 11, .92);
    box-shadow: inset 0 0 26px rgba(0, 0, 0, .65);
  }
  .grip {
    position: absolute; left: 118px; top: 182px; width: 34px; height: 210px;
    border-radius: 18px; transform: rotate(-8deg);
    background: linear-gradient(90deg, #5d3a1a, #c98a44 42%, #6f4620);
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.55));
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hit"></div>
    <div class="ring"></div>
    <div class="fly">🪰</div>
    <div class="swatter"><div class="mesh"></div><div class="grip"></div></div>
    <div class="floor"></div>
  </div>
</body>
</html>

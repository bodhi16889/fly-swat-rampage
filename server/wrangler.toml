name = "fly-swat-lb"
main = "worker.js"
compatibility_date = "2026-10-01"

# 1) npx wrangler d1 create fly-swat-lb
# 2) paste the returned database_id below
# 3) npx wrangler d1 execute fly-swat-lb --remote --file schema.sql
# 4) set GAMEPIX_GAME_ID to the id from the GamePix dashboard
[[d1_databases]]
binding = "DB"
database_name = "fly-swat-lb"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
GAMEPIX_GAME_ID = "REPLACE_WITH_GAMEPIX_GAME_ID"

# Optional: point at a local JWKS during tests.
# JWKS_URL = "http://127.0.0.1:8788/.well-known/jwks.json"
